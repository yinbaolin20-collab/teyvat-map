<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>提瓦特世界观地图</title>
<style>
/* 提瓦特世界观地图 —— 页面样式 */

:root {
  --bg: #0b1120;
  --panel: #121a2d;
  --panel-2: #18223a;
  --panel-3: #1f2b48;
  --line: #2a3756;
  --line-soft: #222d48;
  --text: #e8ecf6;
  --muted: #95a1bd;
  --faint: #66728f;
  --accent: #f1cf7a;
  --accent-ink: #2a2110;
  --danger: #ef6b6b;
  --ok: #5fd3a9;
  --radius: 10px;
  --font: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 18px;
  background: linear-gradient(180deg, #141e36, #10182b);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { color: var(--accent); font-size: 22px; line-height: 1; }
.brand h1 { margin: 0; font-size: 18px; letter-spacing: 1px; font-weight: 700; }
.brand .sub { margin: 0; font-size: 12px; color: var(--muted); }

.progress-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel-2); border: 1px solid var(--line);
  padding: 5px 8px 5px 12px; border-radius: 999px;
}
.progress-box label { color: var(--accent); font-weight: 700; white-space: nowrap; }
.progress-box select {
  max-width: 340px; background: var(--panel-3); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 10px;
}
.spoiler-badge {
  font-size: 12px; color: var(--ok); white-space: nowrap;
  border: 1px solid rgba(95, 211, 169, .4); border-radius: 999px; padding: 1px 8px;
}

.search-box { position: relative; flex: 1 1 200px; max-width: 320px; }
.search-box input {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px; outline: none;
}
.search-box input:focus { border-color: var(--accent); }
.search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 12px 30px rgba(0, 0, 0, .45); overflow: hidden; max-height: 60vh; overflow-y: auto;
}
.search-results button {
  display: flex; width: 100%; gap: 8px; align-items: center; text-align: left;
  background: none; border: 0; padding: 8px 12px; border-bottom: 1px solid var(--line-soft);
}
.search-results button:hover, .search-results button.active { background: var(--panel-3); }
.search-results .kind { font-size: 12px; color: var(--muted); margin-left: auto; }
.search-results .empty { padding: 10px 12px; color: var(--muted); }

.top-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel-2); border: 0; padding: 5px 10px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

/* ---------- 主体布局 ---------- */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 380px;
  gap: 10px; padding: 10px;
  height: calc(100vh - 64px);
}
.layout-map { grid-template-columns: minmax(0, 1fr) 380px; }
.layout-map #graphPane { display: none; }
.layout-graph { grid-template-columns: minmax(0, 1fr) 380px; }
.layout-graph #mapPane { display: none; }

.pane, .side {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.pane-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel-2);
}
.pane-head h2 { margin: 0 6px 0 2px; font-size: 15px; }
.pane-head select {
  background: var(--panel-3); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; max-width: 150px;
}
.check { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--accent); }

.zoom-btns { margin-left: auto; display: inline-flex; gap: 4px; }
.zoom-btns button {
  background: var(--panel-3); border: 1px solid var(--line); border-radius: 6px;
  min-width: 30px; height: 28px; padding: 0 8px;
}
.zoom-btns button:hover { border-color: var(--accent); }

.layer-toggles { display: inline-flex; gap: 4px; }
.layer-toggles button {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--panel-3); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  color: var(--faint); font-size: 13px;
}
.layer-toggles button.on { color: var(--text); border-color: #4b5d88; }
.lg { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.lg-surface { background: #e9e2c8; border: 1.5px solid #fff; }
.lg-sky { background: #bff2ff; box-shadow: 0 0 6px #7fe3ff; transform: rotate(45deg); border-radius: 2px; }
.lg-underground { background: #24123f; border: 1.5px dashed #b88cff; }
.layer-toggles button:not(.on) .lg { opacity: .3; }

.pane-body { position: relative; flex: 1; min-height: 0; }
.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; cursor: grab; }
.stage.dragging { cursor: grabbing; }

#mapSvg { background: radial-gradient(ellipse at 50% 45%, #13284a 0%, #0c1830 55%, #08101f 100%); }
#graphSvg { background: radial-gradient(ellipse at 50% 50%, #141f38 0%, #0d1528 70%); }

.map-note {
  position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--faint);
  pointer-events: none; text-shadow: 0 1px 2px #000;
}
.map-float {
  position: absolute; right: 10px; bottom: 10px; max-width: 60%;
  background: rgba(18, 26, 45, .9); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 8px; font-size: 12px; color: var(--muted);
}
.map-float .chip { margin: 3px 3px 0 0; }

.legend {
  position: absolute; left: 8px; bottom: 8px; right: 8px;
  display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted);
  pointer-events: none; text-shadow: 0 1px 2px #000;
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .hint { width: 100%; color: var(--accent); opacity: .8; }
.legend .ln { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.legend .ln.dash { border-top-style: dashed; }
.legend .shape { width: 10px; height: 10px; display: inline-block; background: #9aa6c2; }
.legend .shape.c { border-radius: 50%; }
.legend .shape.f { clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.legend .shape.l { transform: rotate(45deg) scale(.8); }

/* ---------- 地图元素 ---------- */
.base-map { transition: opacity .3s, filter .3s; }
.only-underground .base-map { filter: brightness(.42) saturate(.55); }
.only-sky .base-map { opacity: .38; filter: blur(1px); }
.nlabel text {
  font-weight: 800; letter-spacing: 4px; paint-order: stroke; stroke: rgba(5, 10, 22, .8); stroke-width: 4px;
  cursor: pointer; text-anchor: middle;
}
.nlabel .nsub { font-size: 11px; font-weight: 400; letter-spacing: 1px; fill: #c9d1e6; stroke-width: 3px; }
.nlabel.unreached text { fill: #6d7894 !important; }
.nlabel.unreached .nsub { fill: #6d7894; }

.mk { cursor: pointer; }
.mk .mlabel {
  font-size: 12px; fill: #eef2fb; paint-order: stroke; stroke: rgba(5, 10, 22, .85); stroke-width: 3px;
  stroke-linejoin: round;
}
.mk.mk-sky .mlabel { fill: #c9f4ff; }
.mk.mk-underground .mlabel { fill: #d9c2ff; }
.mk .evring { fill: none; stroke: rgba(241, 207, 122, .55); stroke-width: 1.2; }
.mk .selring { fill: none; stroke: var(--accent); stroke-width: 2.2; opacity: 0; }
.mk .hlring { fill: none; stroke: #ffe9a8; stroke-width: 2; opacity: 0; }
.mk:hover .mlabel { fill: var(--accent); }
.has-hl .mk:not(.hl):not(.sel) { opacity: .28; }
.has-hl .nlabel:not(.hl):not(.sel) { opacity: .45; }
.mk.hl .hlring { opacity: 1; }
.mk.sel .selring { opacity: 1; animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.mk.sel .mlabel, .mk.hl .mlabel { fill: var(--accent); font-weight: 700; }
.nlabel.sel text:first-child { text-decoration: underline; }
@keyframes pulse {
  0% { transform: scale(.8); opacity: 1; }
  100% { transform: scale(1.9); opacity: 0; }
}

/* ---------- 关系图元素 ---------- */
.edge { fill: none; stroke-width: 1.4; opacity: .55; }
.edge.member { stroke: #7a86a6; stroke-dasharray: 4 4; opacity: .3; stroke-width: 1; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; }
.arrow { opacity: .75; }
.edge.hov { opacity: 1 !important; stroke-width: 2.4; }
.arrow.hov { opacity: 1 !important; }
.elabel { display: none; pointer-events: none; }
.elabel.show { display: inline; }
.elabel text {
  font-size: 11px; text-anchor: middle; dominant-baseline: middle; fill: #eef2fb;
  paint-order: stroke; stroke: rgba(10, 16, 32, .95); stroke-width: 4px; stroke-linejoin: round;
}
.halo { pointer-events: none; }
.halo-label text {
  font-size: 20px; font-weight: 800; letter-spacing: 3px; text-anchor: middle; opacity: .55;
  paint-order: stroke; stroke: rgba(8, 13, 27, .8); stroke-width: 3px;
}
.has-hl .halo { opacity: .45; }
.node { cursor: pointer; }
.node text {
  font-size: 12px; fill: #eef2fb; text-anchor: middle; paint-order: stroke;
  stroke: rgba(8, 13, 27, .9); stroke-width: 3px; stroke-linejoin: round;
}
.node.kind-fac text { fill: #ffe7a6; font-weight: 700; }
.node.kind-loc text { fill: #bfe8ff; }
.node .nshape { stroke: rgba(255, 255, 255, .85); stroke-width: 1.4; }
.node.kind-fac .nshape { stroke-width: 2; }
.node .selring { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; }
.node.extra { opacity: .6; }
.node:hover text { fill: var(--accent); }
.has-hl .node:not(.hl):not(.sel) { opacity: .14; }
.has-hl .edge:not(.hl), .has-hl .arrow:not(.hl) { opacity: .06; }
.has-hl .elabel:not(.hl) { opacity: .25; }
.has-hl .edge.hl { opacity: 1; stroke-width: 2.2; }
.node.sel .selring { opacity: 1; }
.node.sel text, .node.hl text { font-weight: 700; }
.graph-empty { fill: var(--muted); font-size: 14px; text-anchor: middle; }

/* ---------- 侧栏 ---------- */
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.tabs button {
  flex: 1; background: none; border: 0; padding: 10px 6px; color: var(--muted);
  border-bottom: 2px solid transparent; font-weight: 600;
}
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tab-body { flex: 1; overflow-y: auto; padding: 14px; min-height: 0; }

.sel-bar {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  font-size: 12px; color: var(--muted);
}
.sel-bar .btn { padding: 2px 10px; font-size: 12px; }
.d-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.d-head h3 { margin: 0; font-size: 20px; }
.d-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .15); }
.tag {
  display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); background: var(--panel-2); white-space: nowrap;
}
.tag.warn { color: #ffcf8a; border-color: rgba(255, 207, 138, .4); }
.tag.sky { color: #bff2ff; border-color: rgba(127, 227, 255, .45); }
.tag.underground { color: #d6bdff; border-color: rgba(184, 140, 255, .5); }
.d-aliases { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.d-summary { margin: 10px 0 4px; font-size: 15px; }
.d-note { color: var(--muted); font-size: 13px; }
.side h4 {
  margin: 18px 0 8px; font-size: 13px; color: var(--accent); letter-spacing: 1px;
  border-bottom: 1px solid var(--line-soft); padding-bottom: 4px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--panel-3); border: 1px solid var(--line); border-radius: 999px;
  padding: 1px 10px 1px 7px; font-size: 13px; line-height: 1.6;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.chip.fac i { border-radius: 2px; }
.chip.loc i { transform: rotate(45deg); border-radius: 1px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.empty-note { color: var(--faint); font-size: 13px; }

.secret {
  background: rgba(241, 207, 122, .08); border: 1px solid rgba(241, 207, 122, .3);
  border-radius: 8px; padding: 6px 10px; margin-bottom: 6px;
}
.secret small { display: block; color: var(--muted); font-size: 12px; }

.rel-list { list-style: none; margin: 0; padding: 0; }
.rel-list li { display: flex; align-items: flex-start; gap: 6px; padding: 4px 0; border-bottom: 1px dashed var(--line-soft); }
.rel-list .dir { color: var(--faint); width: 14px; flex: none; text-align: center; }
.rel-list .rl { color: var(--muted); font-size: 13px; }
.rel-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 8px; flex: none; }

.ev {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel-2);
}
.ev-act { font-size: 12px; color: var(--accent); }
.ev-sum { margin: 2px 0 6px; }
.ev-open { background: none; border: 0; padding: 0; text-align: left; width: 100%; }
.ev-open:hover .ev-sum { color: var(--accent); }
.ev .chips { gap: 4px; }
.ev .chip { font-size: 12px; }

.ev-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; }
.stat b { display: block; font-size: 20px; color: var(--accent); }
.stat span { font-size: 12px; color: var(--muted); }
.tips { padding-left: 18px; color: var(--muted); }
.tips li { margin-bottom: 4px; }

/* 时间轴 */
.tl-chapter { margin-bottom: 16px; }
.tl-chapter > h4 { margin-top: 0; }
.tl-act { position: relative; padding: 0 0 10px 18px; border-left: 2px solid var(--line); margin-left: 6px; }
.tl-act::before {
  content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--muted);
}
.tl-act.current::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--accent); }
.tl-act-head { font-weight: 700; }
.tl-act-head .ver { font-weight: 400; color: var(--faint); font-size: 12px; margin-left: 4px; }
.tl-act.current .tl-act-head { color: var(--accent); }
.tl-more {
  margin-left: 6px; background: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 0 8px; font-size: 12px; font-weight: 400; color: var(--muted); vertical-align: middle;
}
.tl-more:hover { color: var(--accent); border-color: var(--accent); }

/* 详细剧情 */
.story {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
  font-size: 14.5px; line-height: 1.85; color: #dde3f1;
}
.story-title { color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.story p { margin: 8px 0; }
.story ul, .story ol { margin: 8px 0; padding-left: 20px; }
.story li { margin-bottom: 4px; }
.story b { color: #fff; }
.story h5 { margin: 12px 0 4px; font-size: 14px; color: var(--accent); }
.story table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; line-height: 1.5; }
.story th, .story td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.story th { background: var(--panel-3); }
.story-src { margin-top: 12px !important; }
.tl-ev {
  display: block; width: 100%; text-align: left; margin-top: 6px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
}
.tl-ev:hover { border-color: var(--accent); }
.tl-ev.sel { border-color: var(--accent); background: rgba(241, 207, 122, .1); }
.tl-ev small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.tl-locked {
  border: 1px dashed var(--line); border-radius: 8px; padding: 10px; color: var(--muted); text-align: center;
}

/* 神之心 */
.gn-summary { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.gn-summary b { color: var(--accent); }
.gn-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
.gn-row span { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.gn-mini {
  width: 14px; height: 14px; transform: rotate(45deg); border-radius: 2px; display: inline-block;
  border: 2px solid var(--gc, #888); background: transparent;
}
.gn-mini.taken { background: var(--gc, #888); box-shadow: 0 0 8px var(--gc, #888); }
.gn-mini.lost { border-style: dashed; opacity: .7; }
.gn-card {
  border: 1px solid var(--line); border-left: 4px solid var(--gc, #888); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 10px; background: linear-gradient(90deg, color-mix(in srgb, var(--gc, #888) 12%, transparent), transparent 60%);
}
.gn-title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.gn-gem {
  width: 16px; height: 16px; transform: rotate(45deg); border-radius: 3px;
  background: var(--gc, #888); box-shadow: 0 0 8px var(--gc, #888);
}
.gn-now { margin: 6px 0 4px; }
.gn-now b { color: var(--gc, var(--accent)); }
.gn-path { list-style: none; margin: 6px 0 0; padding: 0; }
.gn-path li { position: relative; padding: 2px 0 6px 20px; }
.gn-path li::before { content: "↓"; position: absolute; left: 4px; top: 1px; color: var(--faint); }
.gn-path li:first-child::before { content: "●"; font-size: 10px; top: 5px; color: var(--gc, #888); }
.gn-path small { display: block; color: var(--muted); font-size: 12px; }

/* 弹窗 */
.modal {
  position: fixed; inset: 0; background: rgba(3, 6, 14, .7); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal-card {
  position: relative; width: min(720px, 100%); max-height: 88vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px;
}
.modal-card h2 { margin: 0 0 8px; }
.modal-card h3 { color: var(--accent); font-size: 15px; margin: 18px 0 6px; }
.modal-card p, .modal-card li { color: #cfd6e8; }
.wide-select {
  width: 100%; background: var(--panel-3); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
.modal-close {
  position: absolute; right: 12px; top: 10px; background: none; border: 0; font-size: 24px; color: var(--muted);
}
.warn-box {
  background: rgba(239, 107, 107, .1); border: 1px solid rgba(239, 107, 107, .4); border-radius: 8px; padding: 8px 12px;
}
.warn-box li { color: #ffc1c1; }

.load-error {
  position: fixed; inset: 0; z-index: 60; background: var(--bg);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.load-error .modal-card { max-width: 640px; }

/* ---------- 窄屏 ---------- */
@media (max-width: 1280px) {
  .layout, .layout-map, .layout-graph {
    grid-template-columns: minmax(0, 1fr) 340px;
    grid-auto-rows: auto;
    height: auto; align-items: start;
  }
  .layout-both #mapPane { grid-column: 1; grid-row: 1; }
  .layout-both #graphPane { grid-column: 1; grid-row: 2; }
  .side { grid-column: 2; grid-row: 1 / span 2; height: calc(100vh - 20px); position: sticky; top: 10px; }

<main id="main" class="layout layout-both">

        <button data-zoom="reset" title="回到全图">复位</button>

        <button data-zoom="reset" title="回到全图">复位</button>
      </div>
    </div>
    <div class="pane-body">
      <svg id="graphSvg" class="stage"></svg>
      <div class="legend" id="graphLegend"></div>
    </div>
  </section>

  <aside class="side">
    <button class="sheet-handle" id="sheetHandle" title="展开或收起"><span></span>点这里展开 / 收起</button>
    <nav class="tabs" id="tabs">
      <button data-tab="detail" class="on">详情</button>

      <button data-tab="gnosis">神之心</button>

    <div class="tab-body" id="tab-detail"></div>
    <div class="tab-body" id="tab-timeline" hidden></div>
    <div class="tab-body" id="tab-gnosis" hidden></div>
  </aside>
</main>

window.GENSHIN_STORY = "# 原神主线剧情详细梳理\n\nOct 25, 2026 · @BAOLIN\n\n## 阅读说明与世界观背景\n\n本文按主线（魔神任务）的推出顺序梳理，截至 7.1 版本（2026年9月）。全文含大量剧透。早期章节依据游戏内容整理，6.x 后半段和至冬篇的部分细节来自官方公告与玩家梳理，以后续版本为准。\n\n### 世界的基本设定\n\n提瓦特是一片由七种元素构成的大陆，七个国家各由一位神明统治，合称「尘世七执政」。被神明认可的凡人会获得「神之眼」，能使用元素力。七神之上还有「天空岛」，那里的统治者被称作「天理」，规定着整个世界的秩序。\n\n| 国家 | 元素 | 神明 | 国家理念 | 对应章节 |\n| --- | --- | --- | --- | --- |\n| 蒙德 | 风 | 巴巴托斯（温迪） | 自由 | 序章 |\n| 璃月 | 岩 | 摩拉克斯（钟离） | 契约 | 第一章 |\n| 稻妻 | 雷 | 巴尔泽布（雷电将军/影） | 永恒 | 第二章 |\n| 须弥 | 草 | 布耶尔（纳西妲） | 智慧 | 第三章 |\n| 枫丹 | 水 | 芙卡洛斯（芙宁娜为其化身） | 正义 | 第四章 |\n| 纳塔 | 火 | 玛薇卡 | 战争 | 第五章 |\n| 至冬 | 冰 | 冰之女皇（安娜丝塔夏） | 爱 | 第六、七章 |\n\n### 两段关键的过去\n\n- 约两千年前的「魔神战争」：众多魔神争夺七个神座，最终胜出的七位成为执政。许多战败魔神的怨念后来成为各国的祸患，比如璃月的漩涡魔神。\n- 500 年前的「坎瑞亚覆灭」：坎瑞亚是位于地下、没有神明的人类国度，以炼金和机械技术闻名。它因触碰禁忌被天理降罚毁灭，幸存者有的变成丘丘人，有的成为深渊教团。坎瑞亚末日的余波也波及了地上各国。\n\n### 开场：双子的离散\n\n玩家扮演的旅行者是一对从世界之外漂流而来的双子之一（男主「空」或女主「荧」，没选的那位就是血亲）。双子准备离开提瓦特时，被一位自称「天理的维系者」的未知神明拦下。一人被封印陷入沉睡，另一人被带走。\n\n旅行者醒来时，世界已经过去了很久。后来的剧情会揭示，双子其实是在 500 年前坎瑞亚覆灭时被卷入的，旅行者在这里一睡就是 500 年。醒来后，旅行者在海边钓起了漂浮的派蒙，两人结伴出发：去拜访七国的神明，打听血亲的下落。这就是整条主线的起点。\n\n## 序章·蒙德「捕风的异乡人」（1.0）\n\n蒙德篇讲的是「风魔龙」危机：一条被污染的守护巨龙袭击城市，而风神本人就混在人群里。结尾愚人众夺走风神的神之心，主线最大的势力线就此展开。\n\n### 第一幕「捕风的异乡人」\n\n旅行者和派蒙在蒙德城外遇到侦察骑士安柏，进城时正赶上风魔龙袭城。旅行者触碰七天神像后获得了风元素之力，在空中帮忙击退了风魔龙。\n\n蒙德由西风骑士团管理。真正的大团长法尔伽带着主力远征在外，由代理团长琴主持大局。骑兵队长凯亚、图书管理员丽莎请旅行者帮忙清理风魔龙曾经的据点，那里已经被深渊教团占据。\n\n调查中，旅行者在风起地附近遇到一位吟游诗人温迪，看到他与风魔龙对话。风魔龙留下的「泪滴」结晶纯净无比，说明它并非天生邪恶。\n\n### 第二幕「为了没有眼泪的明天」\n\n温迪向旅行者坦白：风魔龙其实是蒙德四风守护之一的东风之龙特瓦林。500 年前，坎瑞亚的罪人放出黑龙杜林袭击蒙德，特瓦林击杀了杜林，却吞下了它的毒血，从此长年沉睡疗伤。它醒来时风神已经不在身边，深渊教团趁虚而入，用谎言让它相信自己被风神抛弃。\n\n要唤醒特瓦林，需要风神留下的圣物「天空之琴」。两人从西风大教堂「借」走天空之琴，却发现它的力量已经枯竭，于是用风魔龙的眼泪净化了琴。在追查过程中，温迪的真实身份也揭晓了：他就是风神巴巴托斯。他平时以凡人身份生活，因为蒙德的理念是「自由」，他不愿以神的身份直接统治。\n\n温迪在摘星崖弹琴呼唤特瓦林，特瓦林一度恢复清醒，但深渊法师突然出手，用诅咒再次控制了它。\n\n### 第三幕「巨龙与自由之歌」\n\n琴团长、在暗中以「暗夜英雄」身份行动的晨曦酒庄庄主迪卢克、旅行者和温迪联手，杀入风龙废墟。旅行者在特瓦林背上与深渊法师交战，温迪以琴声相助，最终驱散了诅咒，特瓦林回到了蒙德的守护者位置。\n\n危机解除后，愚人众执行官第八席「女士」突然现身，当众击倒温迪，夺走了他的神之心。旅行者这才知道，至冬的冰之女皇正在收集七神的神之心，而愚人众就是她的执行机构。温迪告诉旅行者，想打听血亲的消息，可以去找下一位神明，也是最古老的那位：岩神摩拉克斯。\n\n## 第一章·璃月「辞行久远之躯」（1.x）\n\n璃月篇的核心是「岩神之死」：统治璃月三千七百年的岩王帝君突然「遇刺」，所有人都在争夺他留下的东西。最终揭晓这是神明亲手安排的退休，璃月从「神治」走向「人治」。第四幕则第一次让旅行者见到了血亲。\n\n### 第一幕「浮世浮生千岩间」\n\n旅行者来到商港璃月，赶上一年一度的「请仙典仪」。岩王帝君每年在这一天降临，为璃月指引来年的方向。可这一次，帝君的仙躯从天上直直坠落，「遇刺身亡」。\n\n掌管璃月的「璃月七星」立刻封锁现场，身为外来者的旅行者被当成嫌疑人。愚人众执行官第十一席「公子」达达利亚出手帮旅行者脱身，并把往生堂的客卿钟离介绍给旅行者。钟离博学而从容，对璃月的历史和习俗无所不知。\n\n为了洗清嫌疑，旅行者前往绝云间拜访守护璃月的仙人们。仙人们怀疑是七星害死了帝君，局势变得紧张。\n\n### 第二幕「辞行久远之躯」\n\n往生堂受托主持帝君的「送仙典仪」，钟离带着旅行者四处筹备：挑选夜泊石、置办香膏、寻找典仪需要的仙家器物……所有开销都由公子买单。这一幕节奏很慢，像是钟离带着旅行者把璃月的风物和历史逛了一遍。\n\n同时，仙人们与七星的矛盾升级。在望舒客栈，旅行者结识了守护璃月、常年与魔神残渣作战的夜叉魈。\n\n### 第三幕「迫近的客星」\n\n公子的真实目的浮出水面：他想潜入停放帝君仙躯的黄金屋，夺取岩神的神之心。结果仙躯里根本没有神之心。走投无路的公子孤注一掷，用邪眼唤醒了被岩神镇压在孤云阁海底的远古魔神「漩涡之魔神」奥赛尔。\n\n天权星凝光与三位仙人联手，旅行者也参战。最后凝光不惜让她倾尽心血的空中宫殿「群玉阁」坠落，压住了奥赛尔。璃月第一次在没有神明出手的情况下，靠凡人与仙人的力量渡过了灾难。\n\n事后，愚人众执行官「女士」现身，钟离当着旅行者的面把神之心交给了她。真相是：钟离就是岩神摩拉克斯本人。帝君的「死」是他和冰之女皇的交易，他用神之心换取至冬的某些承诺，同时借这场「死亡」卸下神职，测试璃月能否在没有神的情况下独立运转。公子从头到尾都只是被「女士」利用的棋子。钟离说他之所以不再当神，是因为契约总有结束的一天，他已经「磨损」得太久了。\n\n### 第四幕「我们终将重逢」\n\n这一幕前，旅行者在世界任务中结识了神秘剑士戴因斯雷布。他自称来自 500 年前覆灭的坎瑞亚，似乎认识旅行者的血亲，并一直在追查深渊教团。\n\n旅行者与戴因调查深渊教团在各地的据点，深入一处深渊异界。在那里，旅行者终于和失散的血亲重逢。血亲已经成为深渊教团的首领，被教团成员称为「王子」或「公主」。\n\n血亲没有跟旅行者回去。TA 告诉旅行者：这个世界有很多旅行者还不知道的真相，在旅途走完之前，现在还不是团聚的时候，然后留下一句「我们终将重逢」就消失了。戴因与血亲之间也明显有着旧怨。从这里开始，「深渊」和「坎瑞亚」成为主线的第二条暗线。\n\n## 间章第一、二幕：璃月的后续（2.4、2.7）\n\n两段间章都发生在璃月，补的是「帝君退场后，璃月人自己怎么扛事」，同时把深渊线往层岩巨渊推进。\n\n### 间章第一幕「风起鹤归」（2.4）\n\n海灯节期间，凝光着手重建坠毁的群玉阁。旅行者在这里结识了申鹤：她自幼被留云借风真君收养，在山中修行，身上的煞气要靠红绳压制，与人间格格不入。剧情围绕申鹤的身世、她与人世的重新连接，以及孤云阁一带残留的魔神威胁展开。戏曲名角云堇也在这一幕登场。\n\n这一幕的意义在于：璃月七星与仙人第一次真正合作，群玉阁也在众人的力量下重新升空。\n\n### 间章第二幕「危途疑踪」（2.7）\n\n旅行者因为在意层岩巨渊最下方的情况，与派蒙一同前去调查，结果在那里遇见了意料之外的人：律法顾问烟绯、荒泷一斗与久岐忍，以及身份神秘的夜兰。众人意外坠入巨渊之底，被困地下。\n\n夜兰明面上是总务司的普通人员，实际上是凝光手下的情报人员，正在追查愚人众和深渊在巨渊里的动作。众人在地底一路寻找出路，旅行者设法联系上了魈。这一幕的高潮是魈在巨渊深处与 500 年前的旧日回忆重逢：当年坎瑞亚灾变时，璃月的夜叉们曾在层岩巨渊与深渊魔物死战，大多没有回来。这段剧情让很多玩家印象深刻。\n\n## 第二章·稻妻「千手百眼，天下人间」（2.x）\n\n稻妻篇讲的是一个神为了「永恒」而让整个国家停止前进：雷神锁国、收缴神之眼，内战因此爆发，愚人众在背后两头获利。最后旅行者凭借众人的愿望，让雷神重新面对「变化」。\n\n### 序幕「振袖秋风问红叶」\n\n离开璃月前，旅行者搭上北斗的南十字船队。船上有一位来自稻妻的流浪武士枫原万叶，他因为反抗「眼狩令」而被通缉，流亡海外。在他口中，旅行者第一次听说稻妻的现状：雷电将军下令锁国，并颁布「眼狩令」，强制收缴民众的神之眼，献给追求「永恒」的雷神。\n\n### 第一幕「不动鸣神，恒常乐土」\n\n旅行者偷渡进入稻妻离岛，在社奉行神里家的托马帮助下进入稻妻城。社奉行的大小姐神里绫华希望借助旅行者的力量，暗中对抗眼狩令。旅行者也认识了烟花店的宵宫等稻妻市民。\n\n为了见到雷神，旅行者主动在眼狩令的仪式上现身。雷电将军亲自出手，一招「无想的一刀」几乎要了旅行者的命。旅行者侥幸脱身，却只能逃离稻妻城。这一刀让旅行者意识到，雷电将军的力量远超常理，单凭武力无法改变稻妻。\n\n### 第二幕「无念无想，泡影断灭」\n\n旅行者逃往海祇岛，加入由「现人神巫女」珊瑚宫心海领导的反抗军，与五郎等人并肩作战。在前线，旅行者发现了一个可怕的阴谋：天领奉行九条家和愚人众暗中向反抗军士兵出售「邪眼」。邪眼能让普通人使用雷元素力，却会不断吸取使用者的生命。\n\n反抗军与幕府军的战争，实际上是愚人众在两边同时下注：一边帮幕府收神之眼，一边用邪眼消耗反抗军的人命。旅行者协助摧毁了邪眼工厂。战场上，天领奉行的大将九条裟罗也开始怀疑自己效忠的对象。\n\n### 第三幕「千手百眼，天下人间」\n\n鸣神大社的宫司八重神子出面指导旅行者。她透露：一直坐镇稻妻的雷电将军其实是一具人偶，真正的雷神「影」把意识封闭在名为「一心净土」的空间中冥想，以此抵御时间带来的「磨损」，追求永恒。\n\n先是愚人众执行官「女士」在御前决斗中败给旅行者，随即被雷电将军当场处决。接着，旅行者在将军面前再次举起反抗之刃。这一次，万叶闯入御前，他手中亡友留下的神之眼亮起；被收缴的无数神之眼里寄托的愿望，也汇聚到旅行者身上。旅行者挡住了无想的一刀，进入一心净土，与影本人当面对决。\n\n影的执念来自 500 年前：她的双胞胎姐姐、前任雷神「真」在坎瑞亚灾变中死去，她因此害怕失去，想让一切永远停在原地。在旅行者和八重神子的劝说下，她决定重新正视「变化」，眼狩令被废除，锁国也随之解除。\n\n结尾，八重神子坦白她已与愚人众做了交易：雷神的神之心交给了愚人众执行官「散兵」，换取愚人众和九条家的势力退出稻妻。\n\n### 第四幕「回响渊底的安魂曲」\n\n这一幕回到深渊线，舞台是层岩巨渊的地下矿区。旅行者与戴因重新合作，追查深渊教团的活动，在地底看到了与坎瑞亚、与血亲有关的过去片段。\n\n这一幕揭开了几件关键的事：\n\n- 500 年前坎瑞亚覆灭时，天理降下的诅咒让许多坎瑞亚人变成了丘丘人等魔物，而一部分血统纯正的人则被诅咒「不死」，戴因就是其中之一。\n- 深渊教团与坎瑞亚的遗民有着直接关系，血亲正是带领他们的人。\n- 血亲与戴因 500 年前曾一起旅行，后来因立场不同而分道扬镳。\n\n旅行者第一次真切地感到：血亲站在深渊那边，也许有自己的理由。\n\n## 第三章·须弥「虚空劫灰往世书」（3.x）\n\n须弥篇的主题是「知识」与「造神」：教令院软禁了年幼的草神，转而和愚人众合作，想用人偶和神之心造一个新神。旅行者帮助纳西妲夺回须弥，同时第一次接触到「世界树」——记录提瓦特一切历史的系统。\n\n### 第一幕「穿越烟帷与暗林」\n\n旅行者来到雨林中的化城郭，结识巡林官提纳里和他的学徒柯莱。柯莱患有一种叫「魔鳞病」的绝症，雨林中也出现了寸草不生的「死域」。这一切都和先代草神大慈树王留下的「禁忌知识」污染有关。\n\n须弥由学术机构「教令院」管理，所有人通过「虚空终端」获取知识。旅行者逐渐发现，现任草神小吉祥草王（纳西妲）在须弥地位很低，甚至被教令院关在净善宫里，民众普遍更怀念五百年前离世的大慈树王。\n\n### 第二幕「千朵玫瑰带来的黎明」\n\n在须弥城，旅行者陷入了诡异的「时间循环」：同一个花神诞祭反复上演，所有人都没有察觉。被软禁的纳西妲通过梦境联系上旅行者，帮助旅行者打破循环。\n\n真相是：教令院与愚人众执行官「博士」合作，借花神诞祭收集全体须弥人的梦境，提炼能量用于「造神计划」。旅行者结识了舞者妮露、书记官艾尔海森等人，也正式见到了纳西妲。\n\n### 第三幕「迷梦与空幻与欺骗」\n\n旅行者前往沙漠调查，与雇佣兵迪希雅、大风纪官赛诺等人接触。沙漠民族与教令院积怨已久，教令院的贤者却正在暗中把沙漠当作造神的实验场。旅行者一步步拼凑出计划的全貌：教令院要以人偶「散兵」为躯体，装入从稻妻得到的雷神之心，造出一位听命于教令院的「正机之神」。\n\n### 第四幕「赤土之王与三朝圣者」\n\n旅行者召集艾尔海森、赛诺、迪希雅、提纳里、妮露等人，策划了一场营救纳西妲的行动。众人分头行动：有人潜入教令院，有人在祖拜尔剧场演出吸引注意，有人对付沙漠中的阻碍。最终众人成功从净善宫救出了纳西妲，教令院的贤者们的阴谋也随之暴露。\n\n### 第五幕「虚空鼓动，劫火高扬」\n\n散兵已在「正机之神」中觉醒为新的神明，力量强大。旅行者与纳西妲进入他的空间与他对决。纳西妲揭示她在梦中已经模拟了无数次这场对决，最终在关键时刻夺取了散兵体内的神之心，击败了他。\n\n纳西妲借助这颗雷神之心连接世界树，唤醒大慈树王残存的意识。原来大慈树王当年为了消除「禁忌知识」的污染，把自己从世界树中抹去。纳西妲最终清除了世界树中的污染，魔鳞病和死域随之消失，但须弥人关于大慈树王的记忆也被一并抹去。\n\n结尾，博士登场与纳西妲谈判。纳西妲以手中的神之心要挟，逼博士毁掉他的「切片」备份；博士则以「世界真相」的情报作交换，最终把雷神之心和草神自己的神之心都带走了。至此，愚人众已经收集了风、岩、雷、草四颗神之心。\n\n### 第六幕「卡利贝尔」\n\n旅行者回到深渊线，在须弥的沙漠中追寻血亲的足迹，看到了 500 年前的往事：坎瑞亚覆灭后，血亲与戴因一起旅行，遇到了一位名叫卡利贝尔的坎瑞亚孩子。卡利贝尔在天理的诅咒下变成了魔物，最终死去。\n\n这段经历是血亲决定站到天理对立面的重要原因：TA 认为天理对坎瑞亚遗民的惩罚是不公正的。旅行者也第一次理解了血亲的愤怒从何而来。\n\n### 间章第三幕「倾落伽蓝」（3.3）\n\n这一幕讲的是散兵的身世。他原本是雷神影制作的第一具人偶，因为「太过脆弱、会哭泣」被封存，后来流落到踏鞴砂，与当地造兵司正丹羽结为好友。博士暗中杀害丹羽，并伪造了丹羽背叛的假象，让散兵从此认定自己被所有人抛弃，最终加入了愚人众。\n\n得知真相后，散兵决定从世界树中删除自己的存在，想以此改写历史。但历史几乎没有改变：博士早已在其他地方埋下了同样的伏笔。抹去自己之后，他以「流浪者」的新身份留在了须弥。由于旅行者来自世界之外，只有旅行者还记得他过去的一切。\n\n## 第四章·枫丹「罪人舞步旋」（4.x）\n\n枫丹篇是一出「审判」：一个预言说所有枫丹人都会溶解在海水里，而高调的水神芙宁娜似乎什么也做不了。最终揭晓，芙宁娜是一个独自扮演神明五百年的凡人，真正的水神用一场「自我审判」破解了预言。\n\n### 第一幕「白露与黑潮的序诗」\n\n旅行者来到正义之国枫丹。这里的一切纠纷都在欧庇克莱歌剧院审判，审判既是司法也是表演，判决由机器「谕示裁定枢机」给出，主持者是沉默威严的最高审判官那维莱特，而水神芙宁娜则热衷在审判台上表演。\n\n旅行者旁听了一场魔术师林尼被指控的审判，主动替他辩护，揭开了案件背后的另一个真相。旅行者由此听说了枫丹流传多年的预言：海水会上涨，所有枫丹人都会溶解在水中，只剩水神独自坐在神座上哭泣。而近年来枫丹确实不断有人「消失」。\n\n### 第二幕「仿若无因飘落的轻雨」\n\n旅行者追查少女连续失踪案，结识了「刺玫会」首领娜维娅。她的父亲卡雷斯多年前被判有罪处决，娜维娅坚信父亲蒙冤。调查揭露，失踪的真相与「原始胎海之水」有关：枫丹人接触这种水就会溶解，而背后有人在利用它作恶。\n\n真凶最终被揭穿，卡雷斯的冤屈也得以洗清。但旅行者被人设计陷害，在审判中被判有罪。\n\n### 第三幕「向深水中的晨星」\n\n旅行者被关进海底监狱梅洛彼得堡，结识了典狱长莱欧斯利。监狱底下藏着大量原始胎海之水的秘密，海水正在上涨。旅行者在狱中查清了关键线索，最终洗清罪名出狱。\n\n### 第四幕「谕示胎动的终焉之刻」\n\n愚人众执行官第四席「仆人」阿蕾奇诺正式登场。旅行者与她合作，对水神芙宁娜提起诉讼，想逼她说出关于预言的真相。审判中，芙宁娜在步步紧逼下精神崩溃，人们开始怀疑她根本不是神。\n\n就在审判过程中，预言开始应验：海水涌入枫丹城，人们开始溶解。\n\n### 第五幕「罪人舞步旋」\n\n真相揭晓。枫丹人原本是由水中的生灵变成的，而水神从前任执政手中继承神位时，就继承了这个「原罪」：天理判定枫丹人终将溶解。为了破解这个命运，水神芙卡洛斯把自己一分为二：一半是作为凡人的芙宁娜，被要求在五百年里扮演「神明」、不能对任何人说出真相；另一半则藏进了谕示裁定枢机，五百年来一直在吸收审判产生的能量。\n\n最终，芙卡洛斯借助积蓄的力量，让枢机判决「水神有罪」，亲手处决了自己的神格，摧毁了水神的神座。这样，被天理夺走的水元素权柄回到了它原本的主人那维莱特手中：他其实是古老的水龙王。那维莱特收回权能后，把枫丹人真正变成了人类，预言就此破解。\n\n同一时期，愚人众执行官「公子」与一头从世界之外闯入的巨兽「吞天之鲸」在海中激战，那维莱特和旅行者也参与了对抗。\n\n芙宁娜终于卸下了扮演五百年的面具，作为普通人重新生活。水神的神之心则交给了阿蕾奇诺。\n\n### 第六幕「睡前故事」\n\n这一幕回到血亲线。旅行者在一场特殊的经历中再次见到血亲，并从 TA 那里听到了一个「睡前故事」：提瓦特最初属于七位龙王，后来一位「原初之人」从世界之外到来，与龙王们交战，夺走了他们的权柄，建立了天空岛和如今的秩序。七神手中的元素权能，其实最初属于龙王。\n\n这个故事第一次从根本上解释了提瓦特的「创世」，也解释了那维莱特这样的龙王与天理之间的恩怨。\n\n### 间章第四幕「悖理」（5.6）\n\n间章回到蒙德。故事围绕阿贝多被指控杀人展开，丘丘人突袭蒙德城成为关键转折，温迪也在紧要关头联络法尔伽与艾莉丝，共同应对动荡局势。阿贝多是炼金术士「黄金」莱茵多特创造的人造生命，这一幕对他的身世和他内心对「人」的认同做了交代，同时为大团长法尔伽回归、以及后续的挪德卡莱篇做了铺垫。\n\n## 第五章·纳塔「炽烈的还魂诗」（5.x）\n\n纳塔篇是一场「全国总动员」：深渊正在侵蚀纳塔的地脉，纳塔距离毁灭只剩一年。火神玛薇卡用五百年布下的计划、愚人众「队长」的另一套方案、以及旅行者的力量，最终合在一起打赢了这场战争。这也是第一个神之心没有交给愚人众的国家。\n\n### 背景：五百年前的布局\n\n纳塔由六大部族组成，人们死后灵魂会回到地脉中的「夜神之国」，英雄可以借「还魂诗」的规则死而复生。这套规则依赖「死之执政」的力量建立。\n\n五百年前，玛薇卡继任火神，被认为是历来最强大的火神。坎瑞亚灾厄时期，她与六英雄预言到 500 年后的纳塔会因夜神之国彻底深渊化而毁灭，于是制定了一个长远计划。与亲人朋友道别后，她把自己的生命存入圣火、提前死去，直到数百年后才复活，继续执行计划。\n\n### 第一幕「荣花与炎日之途」与第二幕「黑石湮落白石下」（5.0）\n\n旅行者来到纳塔，结识了流泉之众的玛拉妮、花翼之集的卡齐娜、竞人族的基尼奇等人。纳塔正处在一场以部族比赛形式出现的「归火圣夜巡礼」中，表面热闹，底下是深渊不断渗透的危机。\n\n卡齐娜在一次事件中落入深渊之手，众人联手营救。救回卡齐娜的同时，众人还净化了被深渊污染的大灵，玛拉妮的古名也因帮助卡齐娜而觉醒。与此同时，愚人众执行官第一席「队长」试图抢夺神之心，被玛薇卡击败，在欧洛伦的帮助下逃脱。事后，玛薇卡邀请旅行者作为「第七位英雄」参与拯救纳塔的行动。\n\n### 第三幕「镜与谜烟的彼方」（5.1）\n\n队长战败后，没有再去打神之心的主意，但他拯救纳塔的目的没有变。他认为玛薇卡背负的责任太重，迟早会错过动用备选方案的时机。他的备选方案原本是：用神之心抽空整个夜神之国的灵魂和记忆，编织一张大网包住地脉，抵挡深渊侵蚀。\n\n这次他想从根源解决问题：重构地脉。为此他找到了古龙时代留下的「秘源机关」。玛薇卡派人阻止，计划失败；过程中欧洛伦得到大灵认可，成为六英杰之一。而秘源机关的启动，也唤醒了掌控夜神之国的「夜神」。\n\n### 第四幕「命定将焚的虹光」（5.2）与幕间「万火归一」\n\n这两段主要揭示玛薇卡计划的全貌和她要付出的代价。玛薇卡击退深渊的强大力量来自「死之执政」，代价是她注定要死，而且是「因果律」级别的死亡，可以推迟，却无法取消。\n\n幕间「万火归一」回到 500 年前：玛薇卡与松伽塔、万杰鲁、孟尼利克、图帕克等古代英雄并肩作战，烬寂海之战中，英雄们一个个牺牲。玛薇卡在家庭午餐上与妹妹伊妮道别，伊妮发誓要找到办法去五百年后与她重逢。\n\n### 第五幕「炽烈的还魂诗」（5.3）\n\n最终决战打响。由于地脉受损，战死者的灵魂无法回到夜神之国，只能消散在大地上。决战中，夜神之国里已逝的灵魂也纷纷现身为生者助战，伊妮、阿伽娅、维查玛等熟悉的面孔都在其中。旅行者与玛薇卡合力取得了决战武器「焚耀千阳」，夜神也为旅行者道出了属于 TA 的古名。旅行者在六大部族的信仰加持下，与玛薇卡一起攻入深渊巢穴。\n\n胜利的代价由队长承担。他用自己的方式代替玛薇卡付出了那份「注定的死亡」：把自己与夜神之国、与纳塔的亡魂绑在一起，让玛薇卡得以活下来。\n\n最特别的是神之心的去向。队长在与玛薇卡一战后，就已致函女皇请求解除自己夺取神之心的任务，并得到许可，所以神之心依然保管在玛薇卡手中。不过玛薇卡也提醒旅行者，纳塔的神之心是女皇计划中所需的最后一枚棋子，女皇不会罢手。\n\n### 第六幕「你存在的时空」（5.7）\n\n这一幕回到血亲线。作为血亲计划的一环，深渊教团开始在纳塔活动，玛薇卡和纳塔的守护者们进入戒备，戴因也第一次以队友身份在前线并肩作战。随着旅行者深入深渊教团的势力范围，血亲长期隐藏的计划逐渐浮出水面。\n\n新角色丝柯克在这一幕登场：她来自深渊深处，师从深渊中的强者，是理解「世界之外」的关键人物。这一幕的结尾，旅行者需要决定是否把一把「休眠舱钥匙」交给一个叫蒂莱尔的人，这个选择与血亲的计划直接相关。\n\n## 第六章「空月之歌」：挪德卡莱与重返须弥（5.8–6.6）\n\n「空月之歌」是至冬的前奏，也是博士这条反派线的终章。挪德卡莱位于至冬最南端，是一片仰望月亮的土地。故事围绕「少女」哥伦比娅找回身份、博士企图夺取月亮的力量展开，最后又绕回须弥，让博士在世界树下迎来结局。整章贯穿「回家」的主题，从开篇《归途》到收尾《归乡》前后呼应。\n\n### 前情：月亮的往事\n\n这一章揭开了提瓦特远古的另一段历史：\n\n- 很久以前，天上有三轮月亮：恒月、霜月、虹月，各由一位女神执掌。她们代替离开提瓦特的龙王尼伯龙根维系这颗星球的运转。\n- 后来，三月女神接纳了从天外降临的「天理」法涅斯，于是被归来的尼伯龙根囚禁在月亮的倒影里，三轮月亮也被改造成对抗天理的武器。\n- 在「葬火之年」的大战中，三位女神全部陨落，两轮月亮破碎，只有霜月保存了下来。恒月女神的遗骸凝成了「月髓」，被挪德卡莱的「霜月之子」部族当作圣物供奉至今。\n- 多年以后，哥伦比娅从霜月中诞生，被霜月之子奉为预言中的新神，却不被提瓦特的法则接纳，力量和记忆都残缺不全，最后成了愚人众执行官第三席「少女」。\n\n### 序奏「归途」（5.8）\n\n故事从纳塔出发，以机械少女伊涅芙踏上归乡之路为起点。旅行者随她来到挪德卡莱，第一次接触到与「烬寂海」和古老飞船有关的线索。\n\n### 第一幕「雪浪与苍林之舞」、第二幕「尘与灯的挽歌」（6.0）\n\n旅行者来到那夏镇，结识了挪德卡莱的几方势力：崇拜月亮的霜月之子（领袖菈乌玛）、守护灯火的菲林斯、经营「秘闻馆」的奈芙尔，以及在当地驻扎的愚人众。这片土地正被一种叫「狂猎」的诡异现象袭扰。\n\n菈乌玛想让族人摆脱对神明的依赖，她私下拜托哥伦比娅不要在霜月之子面前显灵。旅行者也在夜里循着歌声见到了哥伦比娅，但她态度飘忽，像一个「缺失了序章的故事」。众人一起前往愚人众的「月矩力」研究基地寻找失窃的圣物「月髓」，发现博士正在挪德卡莱利用月亮的力量做实验。众人修复大炮驱散狂猎后，前往希汐岛追查与飞船有关的记忆。\n\n### 第三幕「不存在的国土」、第四幕「回望湮灭的月光」（6.1）\n\n「猎月人」借助月矩力光束顺利复活，新的危机笼罩挪德卡莱。西风骑士团大团长法尔伽从安瓦蒂尼尔湖归来，帮众人制定作战方案，挪德卡莱各方空前团结。\n\n众人追查中找到了博士的秘密实验室。在对抗猎月人的过程中，哥伦比娅力量透支，濒临消亡，而她的存在也落入了博士的掌控之中。\n\n### 第五幕「终北的夜行诗」、第六幕「散于晨雾的月芒」（6.2）\n\n狂猎平息后，挪德卡莱迎来「祈月之夜」，这是月亮离提瓦特最近的日子。阿贝多与杜林也在这一段加入队伍，众人一起寻找拯救哥伦比娅的办法。\n\n祈月之夜，哥伦比娅一心奔向月亮，却遭到博士截杀。为了不让博士拿到完整的三月权柄，也为了保护同伴，她主动跳进了「月之门」。\n\n第六幕换成哥伦比娅的视角：月之门连接着过去的时空，她逆着时间回到三月女神尚在的年代，见到了三位「姐姐」。她从初代月神手中继承了完整的权能，找回了自己的真名「哥伦比娅·希珀塞莱尼娅」，把神体化作月光，只把灵魂留作回来的锚点。\n\n### 第七幕「如果在冬夜，一个旅人」、第八幕「真实之月」（6.3）\n\n挪德卡莱的天空被博士的阴谋遮蔽。流浪者与「木偶」桑多涅加入这场战斗，旅行者在众人掩护下面见了三月女神，并做出关键抉择。\n\n最终决战中，哥伦比娅在众人接应下作为完整的月神重临提瓦特，与旅行者一起击败了博士。月 亮回到了它的故乡，挪德卡莱也在月光下迎来新的明天。章节结尾，桑多涅回到了故乡枫丹，与开篇伊涅芙的「归途」形成呼应。\n\n但博士并没有真正死去：在挪德卡莱倒下的，只是他众多「切片」之一，本体早已离开。\n\n### 第九幕「身土坏空，五蕴识转」、第十幕「道成千壑，因果异灭」（6.6）\n\n这两幕回到须弥，接上第三章留下的线头。世界树出现异常，纳西妲陷入昏迷，须弥的众人再次集结。旅行者带着纳西妲去找古老的龙王阿佩普交涉，又一路深入沙漠中的居尔城废墟。\n\n真相是博士本体的终极计划：入侵世界树，用赤王留下的科技「阿如」替换它，然后放火烧掉世界树。根据玩家梳理，结局有几个关键点：\n\n- 世界树大半被焚毁，「阿如」取代了世界树的位置。\n- 纳西妲放弃了世界树的权柄，这个决定得到了三位执政的共同认可。\n- 火神之心在烧树中下落不明。\n- 博士本体最终被自己不同年龄段的切片反噬而死。愚人众执行官第五席「公鸡」也紧急联络纳西妲，表示博士早已不代表愚人众，他的所作所为是个人行为。\n\n世界树被烧，意味着天理规划好的「命运」第一次有了被改写的可能。这为至冬篇的主题埋下了伏笔。\n\n## 第七章·至冬「无神怜爱的雪国」（7.0–7.1，目前最新）\n\n至冬篇正在连载，目前已更新四幕。核心冲突是：冰之女皇准备用收集来的神之心正面挑战天理，而天理派出了「死之执政」若娜瓦来阻挠。7.1 的结尾，若娜瓦在垂死之际摧毁了镇压七国的天钉，留下了整个提瓦特的危机。\n\n### 至冬是个什么样的国家\n\n至冬位于大陆最北端，常年被严寒和暴风雪笼罩，依靠一种叫「克什尼克」的能源取暖，用铁路连接稀疏的聚落。首都至冬堡繁华热闹，也是愚人众的总部。这里的神明冰之女皇（安娜丝塔夏）执掌的理念是「爱」，但她多年来对天理怀着强烈的敌意，愚人众收集神之心正是为了她的反抗计划。\n\n至冬篇有两个关键计划：\n\n- 「严冬计划」：女皇为了节约能源制定的计划。能源缩减后燃料不足、气温骤降，所以叫「严冬」。民间对此怨声载道。\n- 「槲寄生计划」：女皇研发的对抗天理的武器。\n\n### 第一幕「无神怜爱的雪国」（7.0）\n\n旅行者和派蒙从挪德卡莱启程，哥伦比娅等人为他们送行。旅行者搭乘列车穿越冰原进入至冬，途中获得了一件叫「灰眸」的工具，可以抵御严寒、召唤列车、制造冰造物。\n\n在至冬，旅行者结识了一群新面孔：冬之猎手阿罗夏、科洛列夫茨基剧团的首席芭蕾舞者奥黛塔（同时是愚人众「女士」一系的刺客）、首席歌唱家沃雅妮莎。旅行者也与老熟人重逢：在至冬见到了「木偶」桑多涅，公子达达利亚也回到了故乡，他体弱的妹妹冬妮娅第一次登场。\n\n这一幕的另一条线是派蒙。槲寄生计划推进时，派蒙身体出现异样。愚人众执行官首席「丑角」皮耶罗登场，他似乎早就认识派蒙，并亲口证实：派蒙是天空岛的造物，她失去记忆可能是受了某种诅咒。冰之女皇本人也首次正式登场，至此尘世七执政全部亮相。\n\n### 第二幕「死魂灵的夜曲」（7.0）\n\n旅行者在至冬堡深入了解这个国家：在老庭院餐厅、皇都评议会、科洛列夫茨基剧院之间穿梭，旁听评议会，与民间组织的新队友一起刺探严冬计划的内情。\n\n至冬城里接连有人离奇死亡，剧院中甚至发生了集体死亡事件，整段剧情像一场「狼人杀」。目击者米提亚在暴风雪中昏迷前看到了某种东西，用咬破的手指写下了一颗「眼睛」的形状。真相揭开时，「死之执政」若娜瓦原来一直伪装成身边的人，藏在旅行者一行之中。\n\n若娜瓦是天理座下的「四影」之一，负责引导灵魂进入地脉。她亲自出手干扰严冬计划和槲寄生计划，同时盯上了派蒙，想「回收」她。伪装被戳穿后，米提亚和旅行者选择正面直视死神。至冬目前还无法轻易应付这种级别的敌人，科学家和政治、军事领袖共同决定暂停严冬计划。\n\n### 第三幕「白夜似梦初醒」、第四幕「往冥府的安魂歌」（7.1）\n\n肆虐的魔兽陨落后，女皇凯旋重归至冬宫，但严冬计划仍然暂停，死之诅咒在蔓延，民众惶惶不安。为了防止生死之力篡改记忆，至冬人甚至习惯每天把自己的记忆刻录下来。\n\n旅行者终于与女皇面对面，她揭开了自己多年收集神之心背后的真正策略，并邀请旅行者担任她的特使。这一段刻画了女皇的另一面：她并不想以神的权能去「施予爱」，而是想发自内心地爱着至冬。戴因斯雷布也受丑角邀请来到了至冬。\n\n为了对抗死之诅咒，众人借助冬契军年轻指挥官薇斯纳的权能，汇聚众人的生命力凝成「生之印」。与此同时，炼金术士「黄金」莱茵多特以「生之执政」的身份出现，让局势更加复杂。女皇与莱茵多特的对谈信息量巨大，根据玩家梳理：\n\n- 女皇曾见过与天理关系密切的神秘存在阿斯莫代，并掌握相关情报。\n- 500 年前，第三降临者曾登上天空岛与天理谈判，以自己的生命换取了女皇的复活。这段往事把女皇、降临者与坎瑞亚的覆灭联系在了一起，也解释了女皇为什么对天理怀有如此深的仇恨。\n\n最终决战中，若娜瓦在算计下失去了死之权能，权能被天理收回；丑角出手发动了毁灭性的一击。但重伤濒死的若娜瓦在最后一刻启动「地原胚质」，摧毁了钉在七国上空的「寒天之钉」。剧情结束后，蒙德、璃月等各国的角色都抬头看到了天上的异象，整个提瓦特面临被「圣土化」的威胁。\n\n7.1 就停在这个悬念上。下一个版本 7.2 预计在 11 月初上线。\n\n## 贯穿全篇的几条线索\n\n七国走完，主线其实一直在推三条线：愚人众收集神之心、旅行者追寻血亲、以及提瓦特背后「天理」的真相。下面把它们收拢一下，方便对照。\n\n### 七颗神之心的去向\n\n| 神之心 | 怎么离开原主的 | 目前在谁手里 |\n| --- | --- | --- |\n| 风（巴巴托斯） | 蒙德篇结尾被「女士」强夺 | 愚人众（至冬） |\n| 岩（摩拉克斯） | 钟离主动交给「女士」，是与女皇的交易 | 愚人众（至冬） |\n| 雷（巴尔泽布） | 八重神子交给「散兵」，后被纳西妲夺回，又被博士带走 | 愚人众（至冬） |\n| 草（布耶尔） | 纳西妲与博士交易，换取「世界真相」的情报 | 愚人众（至冬） |\n| 水（芙卡洛斯） | 水神破解预言后交给「仆人」 | 愚人众（至冬） |\n| 火（玛薇卡） | 队长主动放弃夺取，留在玛薇卡手中 | 据玩家梳理，在须弥烧树时下落不明 |\n| 冰（冰之女皇） | 女皇自己的 | 冰之女皇 |\n\n### 愚人众执行官现状\n\n| 席位 | 执行官 | 目前状况 |\n| --- | --- | --- |\n| 首席 | 丑角·皮耶罗 | 活跃，参与对抗若娜瓦 |\n| 第一席 | 队长 | 在纳塔为玛薇卡承担了「注定的死亡」 |\n| 第二席 | 博士·多托雷 | 本体在须弥烧树后被自己的切片反噬而死 |\n| 第三席 | 少女·哥伦比娅 | 继承三月权能，成为完整的月神 |\n| 第四席 | 仆人·阿蕾奇诺 | 持有水神之心 |\n| 第五席 | 公鸡·普契涅拉 | 在至冬篇出场 |\n| 第六席 | 散兵 | 已脱离愚人众，以「流浪者」身份活动 |\n| 第七席 | 木偶·桑多涅 | 在挪德卡莱结局回到故乡枫丹，至冬篇再次出场 |\n| 第八席 | 女士 | 在稻妻决斗后被雷电将军处决 |\n| 第九席 | 富人·潘塔罗涅 | 在至冬篇出场 |\n| 第十一席 | 公子·达达利亚 | 回到至冬，与家人团聚 |\n\n### 血亲线走到哪了\n\n- 璃月：第一次重逢，血亲已是深渊教团首领，留下「我们终将重逢」。\n- 稻妻、须弥：通过戴因和「卡利贝尔」的往事，了解到血亲 500 年前目睹了坎瑞亚遗民在天理诅咒下的惨剧，这是 TA 与天理为敌的原因。\n- 枫丹：血亲讲述「睡前故事」，揭开龙王与天理的创世之战。\n- 纳塔：深渊教团按血亲的计划在纳塔行动，计划的轮廓开始显现。\n- 至冬：血亲本人暂未在主线正面登场。\n\n### 还没解开的谜团\n\n- 天钉被毁后的「圣土化」危机会如何收场。\n- 冰之女皇的终极计划，以及她与坎瑞亚、第三降临者之间的完整往事。\n- 派蒙作为天空岛造物的真正用途，以及她与天理的关系。\n- 血亲的最终计划，以及双子重逢的方式。\n- 开场拦下双子的那位「天理的维系者」究竟是谁。\n\n### 资料来源\n\n早期章节依据游戏剧情整理。6.x 后半段与至冬篇参考了以下来源，其中部分细节来自玩家梳理，以游戏内容为准：\n\n- [魔神任务 - 原神 BWIKI](https://wiki.biligame.com/ys/魔神任务)\n- [空月之歌 - 原神 BWIKI](https://wiki.biligame.com/ys/空月之歌)\n- [「往冥府的安魂歌」- 原神 BWIKI](https://wiki.biligame.com/ys/「往冥府的安魂歌」)\n- [纳塔 - 原神 BWIKI](https://wiki.biligame.com/ys/纳塔)\n- [危途疑踪 - 原神 BWIKI](https://wiki.biligame.com/ys/危途疑踪)\n- [至冬 - 维基百科](https://zh.wikipedia.org/wiki/至冬)\n- [哥伦比娅 - 维基百科](https://zh.wikipedia.org/wiki/哥倫比婭)\n- [《原神》7.0 版本上线 - 巴哈姆特](https://gnn.gamer.com.tw/detail.php?sn=309750)\n- [《原神》7.1 版本上线 - 巴哈姆特](https://gnn.gamer.com.tw/detail.php?sn=312222)\n- [纳塔 5.3 主线终章讨论 - 知乎](https://zhuanlan.zhihu.com/p/17752966271)\n- [纳塔新剧情梳理 - 腾讯新闻](https://news.qq.com/rain/a/20241011A05QV700)\n- [7.0 派蒙身世揭秘 - 什么值得买](https://post.smzdm.com/p/a9585poe/)\n- [原神须弥烧树剧情解析 - 233乐园](https://www.233leyuan.com/post-detail/2057295451198828544)\n- [5.6 版本「悖理」- 机核](https://www.gcores.com/articles/197945)\n";

  const UI_KEY = 'teyvat-map.ui';

  // 七国元素色
  const ELEMENT_COLOR = { '风': '#4fd8b0', '岩': '#f2b544', '雷': '#b583f2', '草': '#8bd14b', '水': '#3fa9f5', '火': '#f45b3a', '冰': '#a6e1f5' };
  const NEUTRAL = '#d8d2bf';
  const LAYER_NAME = { surface: '地表', sky: '天空', underground: '地下' };

  // 关系连线的分类和颜色
  const REL_CATS = [
    { key: 'hostile', name: '对立 / 操纵', color: '#ef6b6b', types: ['conflict', 'manipulates', 'disowns'] },
    { key: 'ally', name: '同伴 / 合作', color: '#4fd8b0', types: ['ally', 'companion', 'friend', 'colleague', 'guardian', 'worship', 'invites', 'rival_then_ally', 'conflict_then_ally'] },
    { key: 'bond', name: '亲缘 / 传承', color: '#f1cf7a', types: ['family', 'same_being', 'creator', 'successor', 'origin', 'returns_power', 'sacrifice'] },
    { key: 'deal', name: '契约 / 交易', color: '#b583f2', types: ['contract'] },
    { key: 'other', name: '统领 / 复杂 / 其他', color: '#8fa6d6', types: ['leads', 'complicated', 'knows'] },
  ];
  const relCat = t => REL_CATS.find(c => c.types.includes(t)) || REL_CATS[REL_CATS.length - 1];

  /*
   * 防剧透补丁
   * 数据里有少数字段本身不带 reveal_at，但直接显示就会剧透（比如名字）。
   * until 是幕 id：进度还没到这一幕时，用 value 代替原来的内容。
   */
  const SPOILER_PATCHES = {
    character: {
      'dvalin': {
        name: [{ until: 'prologue-2', value: '风魔龙' }],
        summary: [{ until: 'prologue-2', value: '袭击蒙德城的巨龙' }],
      },
      'wanderer': { name: [{ until: 'interlude-3', value: '散兵' }] },
      'raiden-ei': { name: [{ until: 'ch2-3', value: '雷电将军' }] },
      'sibling': { factions: [{ until: 'ch1-4', value: [] }] },
      'ororon': { summary: [{ until: 'ch5-3', value: '纳塔的青年，曾协助队长' }] },
    },
    faction: {
      'abyss-order': { description: [{ until: 'ch1-4', value: '操纵魔物、与神明为敌的神秘组织' }] },
    },
  };

  // 示意地图上，把七国连成一整块大陆用的「填充点」：[x, y, 半径]
  const LAND_FILL = [
    [0.50, 0.45, 70], [0.52, 0.58, 70], [0.56, 0.40, 60], [0.47, 0.70, 60], [0.40, 0.68, 60], [0.33, 0.48, 60],
    [0.36, 0.38, 55], [0.66, 0.21, 55], [0.70, 0.15, 55], [0.86, 0.12, 55], [0.66, 0.41, 55], [0.58, 0.67, 55],
    [0.74, 0.46, 45], [0.46, 0.36, 55], [0.30, 0.62, 55], [0.22, 0.33, 45], [0.50, 0.30, 45], [0.62, 0.74, 40],
    [0.28, 0.72, 45], [0.44, 0.84, 45], [0.80, 0.20, 40],
  ];

  // ================= 启动 =================
  if (window.GENSHIN_DATA) safeStart(window.GENSHIN_DATA);
  else showLoadError('notfound');

  function safeStart(data) {
    try { start(data); } catch (err) { console.error(err); showLoadError('crash', err); }
  }

  function showLoadError(kind, err) {
    const box = $('#loadError');
    box.hidden = false;
    const msg = kind === 'notfound'
      ? `<p>没有找到网页要用的数据文件 <code>data/genshin_world_data.js</code>。请这样做：</p>
         <ol><li>打开「原神地图」文件夹，双击 <b>更新数据.bat</b>，看到「成功」后按任意键关闭黑色窗口。</li>
         <li>回到这个页面，按键盘上的 <b>F5</b> 刷新。</li></ol>
         <p>也可以点下面的按钮，直接选 <code>data</code> 文件夹里的 <b>genshin_world_data.json</b>（只对这一次打开有效）。</p>`
      : `<p>读取数据时出错了：</p><pre>${esc((err && err.message) || err)}</pre>
         <p>多半是 json 文件格式有问题（比如少了逗号、引号或括号）。改好后双击「更新数据.bat」，再按 F5 刷新。</p>`;
    box.innerHTML = `<div class="modal-card"><h2>还不能显示地图</h2>${msg}
      <p><label class="btn primary">选择 json 文件…<input type="file" accept=".json,application/json" hidden id="pickJson"></label></p>
      <p class="small muted" id="pickMsg"></p></div>`;
    $('#pickJson').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        let data;
        try { data = JSON.parse(reader.result); } catch (er) { $('#pickMsg').textContent = '这个文件不是有效的 json：' + er.message; return; }
        box.hidden = true;
        safeStart(data);
      };
      reader.readAsText(f, 'utf-8');
    });
  }

  function start(D) {
    // ================= 数据索引 =================
    const acts = (D.acts || []).slice().sort((a, b) => a.order - b.order);
    if (!acts.length) throw new Error('数据里没有 acts（主线各幕）');
    const actById = new Map(acts.map(a => [a.id, a]));
    const chapterById = new Map((D.chapters || []).map(c => [c.id, c]));
    const chapterFirst = new Map();
    for (const a of acts) if (!chapterFirst.has(a.chapter)) chapterFirst.set(a.chapter, a);
    const nations = D.nations || [];
    const nationById = new Map(nations.map(n => [n.id, n]));
    const characters = D.characters || [];
    const charById = new Map(characters.map(c => [c.id, c]));
    const factions = D.factions || [];
    const facById = new Map(factions.map(f => [f.id, f]));
    const relationships = D.relationships || [];
    const gnoses = D.gnoses || [];
    const events = (D.events || []).slice();
    const eventById = new Map(events.map(e => [e.id, e]));

    const hasXY = p => !!p && typeof p.x === 'number' && typeof p.y === 'number';
    const locs = new Map();
    for (const n of nations) {
      const m = n.map || {};
      locs.set(n.id, { id: n.id, kind: 'nation', name: n.name, nation: n.id, x: m.x, y: m.y, layer: m.layer || 'surface', note: '' });
      for (const r of n.regions || []) {
        const rm = r.map || {};
        locs.set(r.id, { id: r.id, kind: 'region', name: r.name, nation: n.id, x: rm.x, y: rm.y, layer: rm.layer || m.layer || 'surface', note: r.note || '' });
      }
    }
    for (const s of D.special_locations || []) {
      const sm = s.map || null;
      locs.set(s.id, {
        id: s.id, kind: 'special', name: s.name, nation: null,
        x: sm ? sm.x : null, y: sm ? sm.y : null, layer: (sm && sm.layer) || 'surface', note: s.note || '', reveal_at: s.reveal_at,
      });
    }

    const orderOf = id => (id == null ? -Infinity : (actById.has(id) ? actById.get(id).order : Infinity));
    events.sort((a, b) => orderOf(a.act) - orderOf(b.act) || String(a.id).localeCompare(String(b.id), 'en', { numeric: true }));

    // 每个地点最早发生事件的幕（用来决定地点说明什么时候可以显示）
    const firstEventAt = new Map();
    for (const e of events) {
      if (!e.location) continue;
      const o = orderOf(e.act);
      if (!firstEventAt.has(e.location) || o < firstEventAt.get(e.location)) firstEventAt.set(e.location, o);
    }

    // 关系两端可能是人物、势力或地点（有个别 id 同时是地点和势力，按 人物 > 势力 > 地点 的顺序认）
    function endpoint(id) {
      if (charById.has(id)) return { kind: 'char', id };
      if (facById.has(id)) return { kind: 'fac', id };
      if (locs.has(id)) return { kind: 'loc', id };
      return null;
    }
    const nodeKey = ep => ({ char: 'c:', fac: 'f:', loc: 'l:' }[ep.kind]) + ep.id;

    // ---------- 数据检查（只提示，不影响使用） ----------
    const warnings = [];
    const chkAct = (id, where) => { if (id != null && !actById.has(id)) warnings.push(`${where}：找不到幕「${id}」`); };
    for (const c of characters) {
      chkAct(c.first_act, `人物「${c.name}」的 first_act`);
      (c.secrets || []).forEach(s => chkAct(s.reveal_at, `人物「${c.name}」的秘密`));
      if (c.nation && !nationById.has(c.nation)) warnings.push(`人物「${c.name}」：找不到国家「${c.nation}」`);
      (c.factions || []).forEach(f => { if (!facById.has(f)) warnings.push(`人物「${c.name}」：找不到势力「${f}」`); });
    }
    for (const r of relationships) {
      chkAct(r.reveal_at, `关系「${r.label}」`);
      if (!endpoint(r.source)) warnings.push(`关系「${r.label}」：找不到「${r.source}」`);
      if (!endpoint(r.target)) warnings.push(`关系「${r.label}」：找不到「${r.target}」`);
    }
    for (const e of events) {
      chkAct(e.act, `事件 ${e.id}`);
      if (e.location && !locs.has(e.location)) warnings.push(`事件 ${e.id}：找不到地点「${e.location}」`);
      (e.characters || []).forEach(c => { if (!charById.has(c)) warnings.push(`事件 ${e.id}：找不到人物「${c}」`); });
    }
    for (const s of D.special_locations || []) chkAct(s.reveal_at, `特殊地点「${s.name}」`);
    for (const g of gnoses) {
      (g.path || []).forEach(p => {
        chkAct(p.act, `${g.element}之神之心的流转`);
        if (p.holder && !charById.has(p.holder)) warnings.push(`${g.element}之神之心：找不到持有者「${p.holder}」`);
      });
    }
    if (warnings.length) console.warn('数据检查发现问题：\n' + warnings.join('\n'));

    // ================= 状态 =================
    let ui = {};
    try { ui = JSON.parse(store.get(UI_KEY) || '{}') || {}; } catch (e) { ui = {}; }
    const state = {
      pid: null, P: 0, sel: null,
      layers: Object.assign({ surface: true, sky: true, underground: true }, ui.layers || {}),
      fNation: '', fFaction: '',
      neighbors: ui.neighbors !== false,
      edgeLabels: ui.edgeLabelsAll === true,
      hideIsolated: ui.hideIsolated === true,
      tab: 'detail',
      layout: ['both', 'map', 'graph'].includes(ui.layout) ? ui.layout : 'both',
    };
    const saveUI = () => store.set(UI_KEY, JSON.stringify({ layers: state.layers, neighbors: state.neighbors, edgeLabelsAll: state.edgeLabels, hideIsolated: state.hideIsolated, layout: state.layout }));
    const defaultPid = D.meta && actById.has(D.meta.player_progress) ? D.meta.player_progress : acts[0].id;
    // 第一次打开（没保存过进度）的人，先在弹窗里选进度；选好之前，页面只按最开头一幕显示，避免剧透
    const savedPid = store.get(STORAGE_KEY);
    const firstVisit = !(savedPid && actById.has(savedPid));
    state.pid = firstVisit ? acts[0].id : savedPid;
    state.P = actById.get(state.pid).order;
    const seen = id => orderOf(id) <= state.P;

    // ================= 文字工具 =================
    const CN = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五'];
    function chapterShort(ch) {
      if (ch === 'prologue') return '序章';
      if (ch === 'interlude') return '间章';
      const m = /^ch(\d+)$/.exec(ch || '');
      return m ? `第${CN[+m[1]] || m[1]}章` : (ch || '');
    }
    function actPart(a) {
      const id = String(a.id);
      const suf = id.slice(id.lastIndexOf('-') + 1);
      if (suf === 'interlude') return '幕间';
      if (suf === '0') return '序幕';
      const n = Number(suf);
      return Number.isInteger(n) ? `第${CN[n] || n}幕` : suf;
    }
    const actShort = a => `${chapterShort(a.chapter)} ${actPart(a)}`;
    const actFull = a => `${actShort(a)}「${a.title}」`;
    // 还没玩到的幕只显示编号，不显示标题
    const actName = id => {
      const a = actById.get(id);
      if (!a) return '（未知的幕）';
      return a.order <= state.P ? actFull(a) : actShort(a);
    };
    const rankName = n => (n === 0 ? '首席' : `第${CN[n] || n}席`);

    function patched(kind, id, field, original) {
      const rules = SPOILER_PATCHES[kind] && SPOILER_PATCHES[kind][id] && SPOILER_PATCHES[kind][id][field];
      if (rules) for (const r of rules) if (!seen(r.until)) return r.value;
      return original;
    }
    const charName = c => patched('character', c.id, 'name', c.name);
    const charSummary = c => patched('character', c.id, 'summary', c.summary || '');
    const charFactions = c => patched('character', c.id, 'factions', c.factions || []);
    const allSecretsSeen = c => (c.secrets || []).every(s => seen(s.reveal_at));
    // 别名（比如「巴巴托斯」）常常就是秘密本身，所以要等秘密全部揭晓后才显示
    const charAliases = c => (allSecretsSeen(c) ? (c.aliases || []) : []).filter(a => a !== charName(c));
    const facDesc = f => patched('faction', f.id, 'description', f.description || '');

    function nationColor(nid) {
      const n = nationById.get(nid);
      if (!n) return NEUTRAL;
      if (n.element && ELEMENT_COLOR[n.element]) return ELEMENT_COLOR[n.element];
      if (n.parent) return '#c8c2f4'; // 挪德卡莱：月光银紫
      return NEUTRAL;
    }
    const charColor = c => (c.id === 'traveler' ? '#ffe28a' : nationColor(c.nation));
    const facColor = f => nationColor(f.nation);
    const locColor = l => (l.layer === 'sky' ? '#9be8ff' : l.layer === 'underground' ? '#b88cff' : nationColor(l.nation));
    function nationReached(nid) {
      const n = nationById.get(nid);
      if (!n || !n.chapter) return true;
      const fa = chapterFirst.get(n.chapter);
      return fa ? fa.order <= state.P : true;
    }

    // ================= 按进度计算「能看到什么」 =================
    let V = null;
    let spoilerTokens = [];

    function computeVisible() {
      const v = {
        chars: new Set(), facs: new Set(), locs: new Set(), events: [], rels: [], members: [],
        evByLoc: new Map(), evByChar: new Map(), locsByChar: new Map(), charsByLoc: new Map(),
      };
      for (const c of characters) if (seen(c.first_act)) v.chars.add(c.id);
      v.events = events.filter(e => seen(e.act));
      const evLocs = new Set(v.events.map(e => e.location).filter(Boolean));

      for (const n of nations) if (!n.parent || nationReached(n.id)) v.locs.add(n.id);
      for (const l of locs.values()) {
        if (l.kind === 'region') {
          if (v.locs.has(l.nation) && (nationReached(l.nation) || evLocs.has(l.id))) v.locs.add(l.id);
        } else if (l.kind === 'special') {
          if (seen(l.reveal_at)) v.locs.add(l.id);
        }
      }

      for (const cid of v.chars) for (const f of charFactions(charById.get(cid))) if (facById.has(f)) v.facs.add(f);
      const vis = ep => !!ep && (ep.kind === 'char' ? v.chars.has(ep.id) : ep.kind === 'fac' ? v.facs.has(ep.id) : v.locs.has(ep.id));
      for (const r of relationships) {
        if (!seen(r.reveal_at)) continue;
        const a = endpoint(r.source), b = endpoint(r.target);
        if (!a || !b) continue;
        if (a.kind === 'fac' && vis(b)) v.facs.add(a.id);
        if (b.kind === 'fac' && vis(a)) v.facs.add(b.id);
      }
      for (const r of relationships) {
        if (!seen(r.reveal_at)) continue;
        const a = endpoint(r.source), b = endpoint(r.target);
        if (vis(a) && vis(b)) v.rels.push({ r, a, b });
      }
      for (const cid of v.chars) for (const f of charFactions(charById.get(cid))) if (v.facs.has(f)) v.members.push({ c: cid, f });

      const push = (map, k, val) => { if (!map.has(k)) map.set(k, []); map.get(k).push(val); };
      const link = (cid, lid) => {
        if (!v.locsByChar.has(cid)) v.locsByChar.set(cid, new Set());
        v.locsByChar.get(cid).add(lid);
        if (!v.charsByLoc.has(lid)) v.charsByLoc.set(lid, new Set());
        v.charsByLoc.get(lid).add(cid);
      };
      for (const e of v.events) {
        const lid = e.location && v.locs.has(e.location) ? e.location : null;
        if (lid) push(v.evByLoc, lid, e);
        for (const cid of e.characters || []) {
          if (!v.chars.has(cid)) continue;
          push(v.evByChar, cid, e);
          if (lid) link(cid, lid);
        }
      }
      for (const { a, b } of v.rels) {
        if (a.kind === 'char' && b.kind === 'loc') link(a.id, b.id);
        if (b.kind === 'char' && a.kind === 'loc') link(b.id, a.id);
      }
      return v;
    }

    // 会剧透的名字：还没登场人物的名字/别名、被替换掉的真名、秘密没揭晓前的别名
    function computeSpoilerTokens() {
      const tokens = new Set();
      const add = s => { for (const p of String(s).split(/[\/／·]/)) { const t = p.trim(); if (t.length >= 2) tokens.add(t); } };
      for (const c of characters) {
        if (!V.chars.has(c.id)) { add(c.name); (c.aliases || []).forEach(add); continue; }
        if (charName(c) !== c.name) add(c.name);
        if (!allSecretsSeen(c)) (c.aliases || []).forEach(add);
      }
      for (const cid of V.chars) {
        const c = charById.get(cid);
        for (const p of charName(c).split(/[\/／·]/)) tokens.delete(p.trim());
        for (const a of charAliases(c)) tokens.delete(a);
      }
      return [...tokens];
    }
    function noteVisible(l) {
      if (!l.note) return false;
      const fe = firstEventAt.get(l.id);
      if (fe != null && fe > state.P) return false;
      return !spoilerTokens.some(t => l.note.includes(t));
    }

    function nationEvents(nid) {
      return V.events.filter(e => {
        const l = e.location && locs.get(e.location);
        return l && l.nation === nid && V.locs.has(l.id);
      });
    }
    function nationChars(nid) {
      const s = new Set();
      for (const cid of V.chars) if (charById.get(cid).nation === nid) s.add(cid);
      for (const e of nationEvents(nid)) for (const c of e.characters || []) if (V.chars.has(c)) s.add(c);
      return s;
    }
    function archonOf(n) {
      const c = n.archon && charById.get(n.archon);
      if (c && V.chars.has(c.id) && allSecretsSeen(c)) return { cid: c.id };
      return { text: n.element ? `${n.element}神（身份尚未揭晓）` : '无' };
    }

    // ================= 剧情详细梳理（来自 data 文件夹里的 .md 文件） =================
    // 只取「### 」级别、标题里写着某一幕「标题」的段落。章节开头的全章概要会提前说出后面的揭晓，所以不用。
    const STORY = typeof window.GENSHIN_STORY === 'string' ? window.GENSHIN_STORY : null;
    const storyByAct = new Map();
    function inlineMd(s) {
      return esc(s)
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1') // 链接只保留文字（网页离线使用）
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }
    function mdToHtml(lines) {
      const out = [];
      let para = [], list = null, table = null;
      const flushPara = () => { if (para.length) { out.push(`<p>${inlineMd(para.join(''))}</p>`); para = []; } };
      const flushList = () => {
        if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${inlineMd(i)}</li>`).join('')}</${list.tag}>`); list = null; }
      };
      const flushTable = () => {
        if (!table) return;
        const [headRow, ...rows] = table;
        out.push(`<table><thead><tr>${headRow.map(c => `<th>${inlineMd(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
        table = null;
      };
      const flushAll = () => { flushPara(); flushList(); flushTable(); };
      for (const raw of lines) {
        const line = raw.trim();
        let m;
        if (!line) { flushAll(); continue; }
        if (line.startsWith('|')) {
          flushPara(); flushList();
          const cells = line.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
          if (!cells.every(c => /^:?-{2,}:?$/.test(c))) (table = table || []).push(cells);
          continue;
        }
        flushTable();
        if ((m = /^#{4,6}\s+(.*)$/.exec(line))) { flushAll(); out.push(`<h5>${inlineMd(m[1])}</h5>`); continue; }
        if ((m = /^[-*]\s+(.*)$/.exec(line))) {
          flushPara();
          if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
          list.items.push(m[1]);
          continue;
        }
        if ((m = /^\d+[.、]\s*(.*)$/.exec(line))) {
          flushPara();
          if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
          list.items.push(m[1]);
          continue;
        }
        flushList();
        para.push(line);
      }
      flushAll();
      return out.join('');
    }
    if (STORY) {
      const sections = [];
      let cur = null;
      for (const line of STORY.split(/\r?\n/)) {
        const h = /^(#{1,3})\s+(.*)$/.exec(line);
        if (h) {
          cur = h[1].length === 3 ? { title: h[2].trim(), lines: [] } : null;
          if (cur) sections.push(cur);
        } else if (cur) cur.lines.push(line);
      }
      for (const sec of sections) {
        sec.acts = acts.filter(a => sec.title.includes(`「${a.title}」`)).map(a => a.id);
        if (!sec.acts.length) continue;
        sec.html = mdToHtml(sec.lines);
        for (const id of sec.acts) if (!storyByAct.has(id)) storyByAct.set(id, sec);
      }
    }
    function storyBlock(actId) {
      if (!STORY) return '<div class="empty-note">（没有找到剧情梳理文件。把 .md 文件放进 data 文件夹后，双击「更新数据.bat」再刷新网页。）</div>';
      const sec = storyByAct.get(actId);
      if (!sec) return '<div class="empty-note">（剧情梳理里没有这一幕的单独段落）</div>';
      const later = sec.acts.filter(id => orderOf(id) > state.P);
      if (later.length) {
        return `<div class="empty-note">剧情梳理把这一幕和后面的「${later.map(id => esc(actName(id))).join('」「')}」写在了同一段。为了防剧透，玩到那里后再显示。</div>`;

      return `<div class="story">
          <div class="story-title">${inlineMd(sec.title)}</div>
          ${others.length ? `<p class="small muted">这一段同时讲了：${others.map(id => esc(actName(id))).join('、')}</p>` : ''}

    // ================= 缩放 / 平移（地图和关系图共用） =================
    function makeZoom(svg, vp, opts) {
      const z = { k: 1, tx: 0, ty: 0, k0: 1 };
      let anim = 0, lastK = null;
      function apply() {
        vp.setAttribute('transform', `translate(${z.tx},${z.ty}) scale(${z.k})`);
        if (z.k !== lastK) { lastK = z.k; if (opts.onScale) opts.onScale(z); }
      }
      function size() { const r = svg.getBoundingClientRect(); return { w: r.width, h: r.height }; }
      function go(k, tx, ty, animate) {
        cancelAnimationFrame(anim);
        if (!animate) { z.k = k; z.tx = tx; z.ty = ty; apply(); return; }
        const s = { k: z.k, tx: z.tx, ty: z.ty }, t0 = performance.now(), dur = 450;
        const step = now => {
          let t = Math.min(1, (now - t0) / dur);
          t = 1 - Math.pow(1 - t, 3);
          z.k = s.k + (k - s.k) * t; z.tx = s.tx + (tx - s.tx) * t; z.ty = s.ty + (ty - s.ty) * t;
          apply();
          if (t < 1) anim = requestAnimationFrame(step);
        };
        anim = requestAnimationFrame(step);
      }
      function fit(animate) {
        const b = opts.bounds();
        const { w, h } = size();
        if (w < 10 || h < 10 || !b) return false;
        const pad = 14;
        const k = Math.min((w - pad * 2) / b.w, (h - pad * 2) / b.h);
        z.k0 = k;
        lastK = null;
        go(k, (w - b.w * k) / 2 - b.x * k, (h - b.h * k) / 2 - b.y * k, animate);
        return true;
      }
      function zoomAt(px, py, f) {
        cancelAnimationFrame(anim);
        const k = clamp(z.k * f, z.k0 * 0.6, z.k0 * 10);
        const r = k / z.k;
        z.tx = px - (px - z.tx) * r; z.ty = py - (py - z.ty) * r; z.k = k;
        apply();
      }
      function zoomCenter(f) { const { w, h } = size(); zoomAt(w / 2, h / 2, f); }
      function focus(x, y, mult) {
        const { w, h } = size();
        if (w < 10) return;
        const k = Math.max(z.k, z.k0 * mult);
        go(k, w / 2 - x * k, h / 2 - y * k, true);
      }
      svg.addEventListener('wheel', e => {
        e.preventDefault();
        const r = svg.getBoundingClientRect();
        zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0016)));
      }, { passive: false });
      svg.addEventListener('dblclick', e => {
        const r = svg.getBoundingClientRect();
        zoomAt(e.clientX - r.left, e.clientY - r.top, 1.6);
      });
      let drag = null, pinch = null;
      const touches = new Map(); // 手机上同时按着的手指，用来做双指缩放
      const pinchInfo = () => {
        const [a, b] = [...touches.values()];
        return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      };
      svg.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        cancelAnimationFrame(anim);
        touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { svg.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
        if (touches.size === 2) { drag = null; pinch = pinchInfo(); return; }
        if (touches.size > 2) return;
        const grab = opts.grab ? opts.grab(e.target) : null;
        drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, moved: false, target: e.target, grab };
      });
      svg.addEventListener('pointermove', e => {
        if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pinch && touches.size >= 2) {
          const now = pinchInfo(), r = svg.getBoundingClientRect();
          z.tx += now.x - pinch.x; z.ty += now.y - pinch.y;
          zoomAt(now.x - r.left, now.y - r.top, now.d / pinch.d);
          pinch = now;
          return;
        }
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
        drag.lx = e.clientX; drag.ly = e.clientY;
        if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 4) { drag.moved = true; svg.classList.add('dragging'); }
        if (!drag.moved) return;
        if (drag.grab) drag.grab.move(dx / z.k, dy / z.k);
        else { z.tx += dx; z.ty += dy; apply(); }
      });
      const end = e => {
        touches.delete(e.pointerId);
        if (pinch) {
          if (touches.size < 2) pinch = null;
          try { svg.releasePointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
          return;
        }
        if (!drag || e.pointerId !== drag.id) return;
        const d = drag;
        drag = null;
        svg.classList.remove('dragging');
        try { svg.releasePointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
        if (!d.moved && e.type === 'pointerup' && opts.onTap) opts.onTap(d.target);
      };
      svg.addEventListener('pointerup', end);
      svg.addEventListener('pointercancel', end);
      const onResize = () => { if (!(opts.onResize && opts.onResize(size()))) fit(false); };
      if (window.ResizeObserver) new ResizeObserver(onResize).observe(svg);
      else window.addEventListener('resize', onResize);
      return { z, fit, zoomCenter, focus };
    }
    // 标签和图标的大小：放大时只稍微变大，保持清楚又不挤
    const labelScale = (z, power) => (1 / z.k) * Math.pow(z.k / z.k0, power);

    // ================= 地图 =================
    const MW = 1000, MH = 700;
    const mapSvg = $('#mapSvg');
    const mapVP = svgEl('g', { class: 'vp' }, mapSvg);
    const baseImg = svgEl('image', { class: 'base-map', x: 0, y: 0, width: MW, height: MH, preserveAspectRatio: 'none' }, mapVP);
    const gNationLabels = svgEl('g', {}, mapVP);

    const gSurf = svgEl('g', {}, mapVP);
    const gSky = svgEl('g', {}, mapVP);

    // 地点挨得太近时，把图标稍微推开一点（坐标本来就是示意，不影响意思）
    const dpos = new Map();
    (function spread() {
      const pts = [...locs.values()].filter(l => l.kind !== 'nation' && hasXY(l)).map(l => ({ id: l.id, x: l.x * MW, y: l.y * MH }));
      const MIN = 24;
      for (let it = 0; it < 150; it++) {
        let moved = false;
        for (let i = 0; i < pts.length; i++) {
          for (let j = i + 1; j < pts.length; j++) {
            const a = pts[i], b = pts[j];
            let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
            if (d >= MIN) continue;
            if (d < 0.01) { const ang = ((i * 47 + j * 113) % 360) * Math.PI / 180; dx = Math.cos(ang); dy = Math.sin(ang); d = 1; }
            const p = (MIN - d) / 2, ux = dx / d, uy = dy / d;

    // 国家大字可以放的几个位置：地点群的上方、下方、正中

      const cx = n.map.x * MW, cy = n.map.y * MH;

      nationLabelPos.set(n.id, { x: cx, y: cy });

    function buildBaseMap() {
      const S = 2.5, W = Math.round(MW * S), H = Math.round(MH * S);
      const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
      const blobs = [];
      for (const n of nations) {
        if (hasXY(n.map)) blobs.push([n.map.x, n.map.y, n.id === 'inazuma' ? 40 : (n.parent ? 70 : 100)]);
        for (const r of n.regions || []) if (hasXY(r.map)) blobs.push([r.map.x, r.map.y, n.id === 'inazuma' ? 26 : 42]);
      }
      LAND_FILL.forEach(p => blobs.push(p));
      // 1) 画出一堆圆，模糊后取阈值，得到圆润的大陆轮廓
      const c1 = mk(), x1 = c1.getContext('2d');
      x1.fillStyle = '#fff';
      for (const [x, y, r] of blobs) { x1.beginPath(); x1.arc(x * MW * S, y * MH * S, r * S, 0, Math.PI * 2); x1.fill(); }
      const mask = mk(), xm = mask.getContext('2d');
      xm.filter = `blur(${18 * S}px)`;
      xm.drawImage(c1, 0, 0);
      xm.filter = 'none';
      const img = xm.getImageData(0, 0, W, H), d = img.data;
      for (let i = 0; i < d.length; i += 4) { const a = d[i + 3]; d[i] = d[i + 1] = d[i + 2] = 255; d[i + 3] = clamp((a - 105) * 8, 0, 255); }
      xm.putImageData(img, 0, 0);
      const tinted = (color, blur) => {
        const c = mk(), x = c.getContext('2d');
        if (blur) x.filter = `blur(${blur * S}px)`;
        x.drawImage(mask, 0, 0);
        x.filter = 'none';
        x.globalCompositeOperation = 'source-in';
        x.fillStyle = color;
        x.fillRect(0, 0, W, H);
        return c;
      };
      // 2) 陆地底色 + 各国元素色
      const out = mk(), xo = out.getContext('2d');
      xo.drawImage(mask, 0, 0);
      xo.globalCompositeOperation = 'source-in';
      const lg = xo.createLinearGradient(0, 0, 0, H);
      lg.addColorStop(0, '#2b3552'); lg.addColorStop(1, '#2d3447');
      xo.fillStyle = lg;
      xo.fillRect(0, 0, W, H);
      xo.globalCompositeOperation = 'source-atop';
      for (const n of nations) {
        if (!hasXY(n.map)) continue;
        const col = nationColor(n.id), cx = n.map.x * MW * S, cy = n.map.y * MH * S;
        const R = (n.id === 'inazuma' ? 120 : n.parent ? 95 : 150) * S;
        const g = xo.createRadialGradient(cx, cy, 0, cx, cy, R);
        g.addColorStop(0, hexA(col, 0.55)); g.addColorStop(0.55, hexA(col, 0.26)); g.addColorStop(1, hexA(col, 0));
        xo.fillStyle = g;
        xo.beginPath(); xo.arc(cx, cy, R, 0, Math.PI * 2); xo.fill();
      }
      // 3) 海岸线和浅海
      xo.globalCompositeOperation = 'destination-over';
      xo.drawImage(tinted('rgba(170,210,255,.9)', 1.2), 0, 0);
      xo.drawImage(tinted('rgba(64,120,190,.55)', 22), 0, 0);
      baseImg.setAttribute('href', out.toDataURL('image/png'));
    }

    function starPath(R, r) {
      let p = '';
      for (let i = 0; i < 10; i++) {
        const ang = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R;
        p += (i ? 'L' : 'M') + (Math.cos(ang) * rad).toFixed(2) + ',' + (Math.sin(ang) * rad).toFixed(2);
      }
      return p + 'Z';
    }

    function renderMap() {

    }
    function applyMapScale() {
      if (!mapZoom) return;

    // 给每个地名找一个不和别的图标、文字重叠的位置（按当前缩放计算）
    function placeMapLabels(s) {
      const boxes = [];
      const overlap = b => {
        let a = 0;
        for (const o of boxes) {
          const w = Math.min(b.x1, o.x1) - Math.max(b.x0, o.x0), h = Math.min(b.y1, o.y1) - Math.max(b.y0, o.y0);
          if (w > 0 && h > 0) a += w * h;
        }
        return a;
      };
      const best = opts => {
        let pick = opts[0], min = Infinity;
        for (const o of opts) {
          const a = overlap(o.box);
          if (a < min - 1e-9) { min = a; pick = o; if (a === 0) break; }
        }
        return pick;
      };
      const textWidth = (g, els) => {
        if (!g.__w) g.__w = Math.max(0, ...els.map(t => { try { return t.getComputedTextLength(); } catch (e) { return 0; } }));
        return (g.__w || 60) + 4;
      };
      const markers = $$('.mk', mapVP);
      for (const g of markers) {
        const p = g.__p, r = 10 * s;
        boxes.push({ x0: p.x - r, y0: p.y - r, x1: p.x + r, y1: p.y + r });
      }
      for (const g of $$('.nlabel', mapVP)) {
        const w = textWidth(g, $$('text', g)) * s, hasSub = !!$('.nsub', g);
        const opts = (nationLabelCands.get(g.__nid) || []).map(c => {
          const y = c.y + c.dy * s;
          return { x: c.x, y, box: { x0: c.x - w / 2, y0: y - 20 * s, x1: c.x + w / 2, y1: y + (hasSub ? 18 : 4) * s } };
        });
        if (!opts.length) continue;
        const pick = best(opts);
        g.setAttribute('transform', `translate(${pick.x},${pick.y})`);
        boxes.push(pick.box);
      }
      const CANDS = [[13, 4, 'start'], [-13, 4, 'end'], [0, -14, 'middle'], [0, 23, 'middle'], [10, -9, 'start'], [10, 18, 'start'], [-10, -9, 'end'], [-10, 18, 'end']];
      const order = markers.slice().sort((a, b) => (b.__ev || 0) - (a.__ev || 0));
      for (const g of order) {
        const t = g.__t, p = g.__p, w = textWidth(g, [t]) * s;
        const opts = CANDS.map(([ox, oy, anchor]) => {

          const x0 = anchor === 'start' ? ax : anchor === 'end' ? ax - w : ax - w / 2;

        t.style.visibility = crowded ? 'hidden' : '';

    // ================= 人物关系图 =================
    const GW = 1500;
