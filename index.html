    const graphSvg = $('#graphSvg');
    const graphVP = svgEl('g', { class: 'vp' }, graphSvg);
    const gHalos = svgEl('g', {}, graphVP);
    const gEdges = svgEl('g', {}, graphVP);
    const gEdgeHits = svgEl('g', { class: 'edge-hits' }, graphVP);
    const gArrows = svgEl('g', {}, graphVP);
    const gNodes = svgEl('g', {}, graphVP);
    const gELabels = svgEl('g', {}, graphVP);
    let G = { nodes: [], links: [], byKey: new Map(), byEl: new Map(), groups: [] };
    let hoverKey = null, hoverLink = null;

    // 每个节点属于哪个「国家区」（不属于任何国家的放在正中间）
    function groupOf(n) {
      if (n.kind === 'char') return charById.get(n.id).nation || '';
      if (n.kind === 'fac') return facById.get(n.id).nation || '';
      return locs.get(n.id).nation || '';
    }
    const groupColor = g => (g ? nationColor(g) : NEUTRAL);
    const groupName = g => (g ? (nationById.get(g) || {}).name || g : '无所属国家');

    function buildGraph() {
      const all = new Map();
      const addNode = (kind, id) => {
        const k = nodeKey({ kind, id });
        if (!all.has(k)) all.set(k, { key: k, kind, id });
        return k;
      };
      for (const cid of V.chars) addNode('char', cid);
      for (const fid of V.facs) addNode('fac', fid);
      const links = [];
      for (const x of V.rels) links.push({ s: addNode(x.a.kind, x.a.id), t: addNode(x.b.kind, x.b.id), rel: x.r });
      for (const m of V.members) links.push({ s: 'c:' + m.c, t: 'f:' + m.f, member: true });

      let core = null;
      if (state.fNation || state.fFaction) {
        core = new Set();
        for (const cid of V.chars) {
          const c = charById.get(cid);
          if (state.fNation && c.nation !== state.fNation) continue;
          if (state.fFaction && !charFactions(c).includes(state.fFaction)) continue;
          core.add('c:' + cid);
        }
        if (state.fFaction) core.add('f:' + state.fFaction);
        if (state.fNation && !state.fFaction) {
          for (const fid of V.facs) if (facById.get(fid).nation === state.fNation) core.add('f:' + fid);
          if (all.has('l:' + state.fNation)) core.add('l:' + state.fNation);
        }
      }
      const keep = core ? new Set(core) : new Set(all.keys());
      const extra = new Set();
      if (core && state.neighbors) {
        for (const l of links) {
          if (core.has(l.s) && !core.has(l.t)) extra.add(l.t);
          if (core.has(l.t) && !core.has(l.s)) extra.add(l.s);
        }
      }
      extra.forEach(k => keep.add(k));
      let lk = links.filter(l => keep.has(l.s) && keep.has(l.t));
      if (core) lk = lk.filter(l => core.has(l.s) || core.has(l.t));
      // 「隐藏没关系的人」：没有任何人物关系连线的人物不显示（只属于某个势力不算）
      if (state.hideIsolated) {
        const related = new Set();
        for (const l of lk) if (!l.member) { related.add(l.s); related.add(l.t); }
        for (const k of [...keep]) if (k.startsWith('c:') && !related.has(k)) keep.delete(k);
        lk = lk.filter(l => keep.has(l.s) && keep.has(l.t));
      }
      const nodes = [...keep].map(k => all.get(k)).filter(Boolean);
      const deg = new Map();
      for (const l of lk) { deg.set(l.s, (deg.get(l.s) || 0) + 1); deg.set(l.t, (deg.get(l.t) || 0) + 1); }
      const groups = [...new Set(nodes.map(groupOf))];
      for (const n of nodes) {
        n.extra = extra.has(n.key);
        n.deg = deg.get(n.key) || 0;
        n.group = groupOf(n);
        if (n.kind === 'char') {
          const c = charById.get(n.id);
          n.name = charName(c); n.color = charColor(c); n.r = 7 + Math.min(n.deg, 10) * 0.7; n.harb = c.harbinger_rank != null;
        } else if (n.kind === 'fac') {
          const f = facById.get(n.id);
          n.name = f.name; n.color = facColor(f); n.r = 11;
        } else {
          const l = locs.get(n.id);
          n.name = l.name; n.color = locColor(l); n.r = 8;
        }
        n.labW = textWidth(n.name, 12) + 6;
        n.x = GCENTER.x; n.y = GCENTER.y; // 真正的位置由 layoutGraph 算
      }
      // 同一对之间有多条关系时，连线弯开
      const pairCount = new Map(), pairIdx = new Map();
      const pk = l => (l.s < l.t ? l.s + '|' + l.t : l.t + '|' + l.s);
      for (const l of lk) pairCount.set(pk(l), (pairCount.get(pk(l)) || 0) + 1);
      for (const l of lk) {
        const k = pk(l), i = pairIdx.get(k) || 0;
        pairIdx.set(k, i + 1);
        const cnt = pairCount.get(k);
        l.off = cnt > 1 ? (i - (cnt - 1) / 2) * 46 : 0;
      }
      return { nodes, links: lk, groups };
    }

    // 排布分两步：先在每个国家区内部排好，量出每块多大；再把各块按地理方位绕着中间摆开，保证区与区不重叠
    function geoAngle(g) {
      const n = nationById.get(g);
      return n && hasXY(n.map) ? Math.atan2(n.map.y - 0.45, n.map.x - 0.55) : 0;
    }
    function layoutGraph(nodes, links) {
      const byKey = new Map(nodes.map(n => [n.key, n]));
      const groups = new Map();
      for (const n of nodes.slice().sort((a, b) => b.deg - a.deg)) {
        if (!groups.has(n.group)) groups.set(n.group, []);
        groups.get(n.group).push(n);
      }
      const inner = [], cross = [];
      for (const l of links) {
        const a = byKey.get(l.s), b = byKey.get(l.t);
        if (!a || !b) continue;
        (a.group === b.group ? inner : cross).push({ a, b, member: !!l.member });
      }
      // 两个人至少隔多远：圆点大小 + 名字长度
      const minDist = (a, b) => Math.max(a.r + b.r + 52, 0.68 * (a.labW + b.labW) + 10);

      function localLayout(members, iters) {
        const set = new Set(members), N = members.length;
        const L = inner.filter(l => set.has(l.a));
        for (const n of members) { n.vx = 0; n.vy = 0; }
        for (let it = 0; it < iters; it++) {
          const alpha = 1 - (it / iters) * 0.85;
          for (let i = 0; i < N; i++) {
            const a = members[i];
            for (let j = i + 1; j < N; j++) {
              const b = members[j];
              let dx = b.lx - a.lx, dy = b.ly - a.ly, d2 = dx * dx + dy * dy;
              if (d2 < 1) { dx = hashStr(a.key + b.key) - 0.5; dy = hashStr(b.key + a.key) - 0.5; d2 = dx * dx + dy * dy + 0.01; }
              const d = Math.sqrt(d2), md = minDist(a, b);
              let f = 5000 / d2;
              if (d < md) f += (md - d) * 0.4;
              const fx = dx / d * f, fy = dy / d * f;
              a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
            }
          }
          for (const l of L) {
            const dx = l.b.lx - l.a.lx, dy = l.b.ly - l.a.ly, d = Math.hypot(dx, dy) || 1;
            const f = (d - (l.member ? 80 : 110)) * 0.05, fx = dx / d * f, fy = dy / d * f;
            l.a.vx += fx; l.a.vy += fy; l.b.vx -= fx; l.b.vy -= fy;
          }
          for (const n of members) {
            n.vx -= n.lx * 0.03; n.vy -= n.ly * 0.03;
            if (n.pull) { n.vx += n.pull.x * 1.6; n.vy += n.pull.y * 1.6; }
          }
          for (const n of members) {
            n.vx *= 0.55; n.vy *= 0.55;
            const sp = Math.hypot(n.vx, n.vy), max = 30 * alpha + 2;
            if (sp > max) { n.vx *= max / sp; n.vy *= max / sp; }
            n.lx += n.vx * alpha; n.ly += n.vy * alpha;
          }
        }
        for (let it = 0; it < 60; it++) {
          for (let i = 0; i < N; i++) {
            for (let j = i + 1; j < N; j++) {
              const a = members[i], b = members[j];
              const dx = b.lx - a.lx, dy = b.ly - a.ly, d = Math.hypot(dx, dy) || 0.01, md = minDist(a, b);
              if (d >= md) continue;
              const p = (md - d) / 2, ux = dx / d, uy = dy / d;
              a.lx -= ux * p; a.ly -= uy * p; b.lx += ux * p; b.ly += uy * p;
            }
          }
        }
        let R = 50;
        for (const n of members) R = Math.max(R, Math.hypot(n.lx, n.ly) + n.r + n.labW / 2 + 12);
        return R;
      }

      function placeGroups(R) {
        const centers = new Map(), C = { x: GW / 2, y: GH / 2 };
        const ring = [...R.keys()].filter(g => g !== '').sort((a, b) => geoAngle(a) - geoAngle(b));
        const hasCenter = R.has('');
        if (hasCenter) centers.set('', { ...C });
        if (!ring.length) return centers;
        if (ring.length === 1 && !hasCenter) { centers.set(ring[0], { ...C }); return centers; }
        const A = clamp(GH / GW, 0.7, 1.5), gap = 46;
        const total = ring.reduce((sum, g) => sum + R.get(g) + gap, 0);
        let ang = geoAngle(ring[0]) - Math.PI * (R.get(ring[0]) + gap) / total;
        const angles = ring.map(g => {
          const span = Math.PI * 2 * (R.get(g) + gap) / total, mid = ang + span / 2;
          ang += span;
          return mid;
        });
        const Rc = hasCenter ? R.get('') : 0;
        const pos = D => ring.map((g, i) => ({ x: C.x + Math.cos(angles[i]) * D, y: C.y + Math.sin(angles[i]) * D * A }));
        let D = 10;
        for (; D < 8000; D += 8) {
          const P = pos(D);
          let ok = true;
          for (let i = 0; i < ring.length && ok; i++) {
            const ri = R.get(ring[i]);
            if (hasCenter && Math.hypot(P[i].x - C.x, P[i].y - C.y) < Rc + ri + gap) ok = false;
            for (let j = i + 1; j < ring.length && ok; j++) {
              if (Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y) < ri + R.get(ring[j]) + gap) ok = false;
            }
          }
          if (ok) break;
        }
        pos(D).forEach((pt, i) => centers.set(ring[i], pt));
        return centers;
      }

      // 初始位置：关系多的人放在区中间，其余按螺旋排开
      for (const ms of groups.values()) {
        ms.forEach((n, i) => { const a = i * 2.39996, rr = 30 * Math.sqrt(i); n.lx = Math.cos(a) * rr; n.ly = Math.sin(a) * rr; n.pull = null; });
      }
      const R = new Map();
      for (const [g, ms] of groups) R.set(g, localLayout(ms, 260));
      let centers = placeGroups(R);
      // 第二轮：和别国有关系的人，往对方那一侧靠，连线就不用横穿整个区
      const pulls = new Map();
      for (const { a, b } of cross) {
        for (const [x, y] of [[a, b], [b, a]]) {
          const c1 = centers.get(x.group), c2 = centers.get(y.group);
          const dx = c2.x - c1.x, dy = c2.y - c1.y, d = Math.hypot(dx, dy) || 1;
          const pp = pulls.get(x) || { x: 0, y: 0 };
          pp.x += dx / d; pp.y += dy / d;
          pulls.set(x, pp);
        }
      }
      for (const [n, pp] of pulls) { const d = Math.hypot(pp.x, pp.y) || 1; n.pull = { x: pp.x / d, y: pp.y / d }; }
      for (const [g, ms] of groups) R.set(g, localLayout(ms, 180));
      centers = placeGroups(R);
      for (const n of nodes) {
        const c = centers.get(n.group);
        n.x = c.x + n.lx; n.y = c.y + n.ly;
      }
    }

    function graphBounds() {
      if (!G.nodes.length) return { x: 0, y: 0, w: GW, h: GH };
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const n of G.nodes) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
      const pad = 70, w = Math.max(x1 - x0, 260), h = Math.max(y1 - y0, 220);
      // 下边多留一点，给图例让位置
      return { x: (x0 + x1) / 2 - w / 2 - pad, y: (y0 + y1) / 2 - h / 2 - pad, w: w + pad * 2, h: h + pad * 2 + 90 };
    }

    function renderGraph(relayout) {
      if (relayout) {
        // 按关系图窗口的形状来铺开（竖长的窗口就铺得高一些）
        const r = graphSvg.getBoundingClientRect();
        if (r.width > 50 && r.height > 50) {
          GH = clamp(GW * r.height / r.width, 750, 1800);
          GCENTER = { x: GW * 0.5, y: GH * 0.5 };
          layoutAspect = r.height / r.width;
        }
      }
      const { nodes, links, groups } = buildGraph();
      if (relayout) layoutGraph(nodes, links);
      G = { nodes, links, byKey: new Map(nodes.map(n => [n.key, n])), byEl: new Map(), groups: [] };
      hoverKey = null; hoverLink = null;
      [gHalos, gEdges, gEdgeHits, gArrows, gELabels, gNodes].forEach(g => { g.textContent = ''; });
      // 国家区：每个节点下面垫一个大圆，整组半透明，连起来就是一块底色
      for (const g of groups) {
        const members = nodes.filter(n => n.group === g);
        if (!members.length) continue;
        const color = groupColor(g);
        const wrap = svgEl('g', { class: 'halo' }, gHalos);
        const blob = svgEl('g', { opacity: g ? 0.13 : 0.07 }, wrap);
        const circles = members.map(n => ({ n, el: svgEl('circle', { r: 58, fill: color }, blob) }));
        const label = svgEl('g', { class: 'halo-label' }, wrap);
        const t = svgEl('text', { fill: color }, label);
        t.textContent = groupName(g);
        G.groups.push({ id: g, circles, label, members });
      }
      for (const l of links) {
        const color = l.member ? null : relCat(l.rel.type).color;
        l.el = svgEl('path', { class: 'edge' + (l.member ? ' member' : ''), 'vector-effect': 'non-scaling-stroke' }, gEdges);
        if (color) l.el.setAttribute('stroke', color);
        l.hl = false; l.hov = false;
        if (!l.member) {
          l.hit = svgEl('path', { class: 'edge-hit', 'vector-effect': 'non-scaling-stroke' }, gEdgeHits);
          l.hit.__link = l;
          l.arrow = svgEl('path', { class: 'arrow', fill: color }, gArrows);
          l.lab = svgEl('g', { class: 'elabel' }, gELabels);
          svgEl('text', {}, l.lab).textContent = l.rel.label || '';
          l.labW = textWidth(l.rel.label || '', 11) + 8;
        } else {
          l.hit = null; l.arrow = null; l.lab = null;
        }
      }
      for (const n of nodes) {
        const sel = { char: 'char:', fac: 'fac:', loc: 'loc:' }[n.kind] + n.id;
        const g = svgEl('g', { class: `node kind-${n.kind}${n.extra ? ' extra' : ''}`, 'data-sel': sel }, gNodes);
        svgEl('circle', { class: 'selring', r: n.r + 5 }, g);
        if (n.kind === 'char') {
          if (n.harb) svgEl('circle', { r: n.r + 3.2, fill: 'none', stroke: '#ef6b6b', 'stroke-width': 1.2, 'stroke-dasharray': '2 2' }, g);
          svgEl('circle', { class: 'nshape', r: n.r, fill: n.color }, g);
        } else if (n.kind === 'fac') {
          let d = '';
          for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; d += (i ? 'L' : 'M') + (Math.cos(a) * n.r).toFixed(2) + ',' + (Math.sin(a) * n.r).toFixed(2); }
          svgEl('path', { class: 'nshape', d: d + 'Z', fill: '#151c30', style: `stroke:${n.color}` }, g);
        } else {
          svgEl('path', { class: 'nshape', d: `M0,${-n.r}L${n.r},0L0,${n.r}L${-n.r},0Z`, fill: '#16223b', style: `stroke:${n.color}` }, g);
        }
        n.lab = svgEl('text', { y: n.r + 14 }, g);
        n.lab.textContent = n.name;
        n.labW = textWidth(n.name, 12) + 6;
        const kindName = { char: '人物', fac: '势力', loc: '地点' }[n.kind];
        svgEl('title', {}, g).textContent = `${n.name}（${kindName}）`;
        n.el = g;
        G.byEl.set(g, n);
      }
      if (!nodes.length) {
        const t = svgEl('text', { class: 'graph-empty', x: GW / 2, y: GH / 2 }, gNodes);
        t.textContent = '没有符合筛选条件的人物';
      }
      if (relayout && graphZoom) graphZoom.fit(false);
      updateGraphGeometry();
    }

    // 估算文字宽度（中文按一个字号宽，英文数字按半个）
    function textWidth(str, size) {
      let w = 0;
      for (const ch of String(str)) w += ch.charCodeAt(0) < 128 ? size * 0.55 : size;
      return w;
    }
    const qpt = (g, t) => {
      const u = 1 - t;
      return { x: u * u * g.x0 + 2 * u * t * g.cx + t * t * g.x1, y: u * u * g.y0 + 2 * u * t * g.cy + t * t * g.y1 };
    };

    function updateGraphGeometry() {
      if (!graphZoom) return;
      const s = labelScale(graphZoom.z, 0.3);
      for (const n of G.nodes) n.el.setAttribute('transform', `translate(${n.x.toFixed(1)},${n.y.toFixed(1)}) scale(${s})`);
      for (const gr of G.groups) {
        let top = Infinity, sx = 0;
        for (const { n, el } of gr.circles) {
          el.setAttribute('cx', n.x.toFixed(1)); el.setAttribute('cy', n.y.toFixed(1));
          top = Math.min(top, n.y); sx += n.x;
        }
        gr.labelPos = { x: sx / gr.circles.length, y: top - 52 };
        gr.label.setAttribute('transform', `translate(${gr.labelPos.x.toFixed(1)},${gr.labelPos.y.toFixed(1)}) scale(${s})`);
      }
      for (const l of G.links) {
        const a = G.byKey.get(l.s), b = G.byKey.get(l.t);
        if (!a || !b) continue;
        const [p, q] = l.s < l.t ? [a, b] : [b, a];
        const dd = Math.hypot(q.x - p.x, q.y - p.y) || 1;
        const px = -(q.y - p.y) / dd, py = (q.x - p.x) / dd;
        const cx = (a.x + b.x) / 2 + px * l.off, cy = (a.y + b.y) / 2 + py * l.off;
        let sx = cx - a.x, sy = cy - a.y; const sd = Math.hypot(sx, sy) || 1; sx /= sd; sy /= sd;
        let ex = b.x - cx, ey = b.y - cy; const ed = Math.hypot(ex, ey) || 1; ex /= ed; ey /= ed;
        const x0 = a.x + sx * a.r * s, y0 = a.y + sy * a.r * s;
        const x1 = b.x - ex * (b.r + 2) * s, y1 = b.y - ey * (b.r + 2) * s;
        l.geo = { x0, y0, cx, cy, x1, y1 };
        const d = `M${x0.toFixed(1)},${y0.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
        l.el.setAttribute('d', d);
        if (l.hit) l.hit.setAttribute('d', d);
        if (l.arrow) {
          const as = 6 * s, bx = x1 - ex * as * 1.7, by = y1 - ey * as * 1.7, nx = -ey * as * 0.75, ny = ex * as * 0.75;
          l.arrow.setAttribute('d', `M${x1.toFixed(1)},${y1.toFixed(1)}L${(bx + nx).toFixed(1)},${(by + ny).toFixed(1)}L${(bx - nx).toFixed(1)},${(by - ny).toFixed(1)}Z`);
        }
      }
      placeGraphLabels(s);
    }

    // 摆放人名和关系说明：先放人名，再给要显示的关系说明找不压住别人的位置
    function placeGraphLabels(s) {
      if (!graphZoom) return;
      const boxes = [];
      const overlap = b => {
        let a = 0;
        for (const o of boxes) {
          const w = Math.min(b.x1, o.x1) - Math.max(b.x0, o.x0), h = Math.min(b.y1, o.y1) - Math.max(b.y0, o.y0);
          if (w > 0 && h > 0) a += w * h;
        }
        return a;
      };
      const best = opts => {
        let pick = opts[0], min = Infinity;
        for (const o of opts) {
          const a = overlap(o.box);
          if (a < min - 1e-9) { min = a; pick = o; if (a === 0) break; }
        }
        return pick;
      };
      for (const n of G.nodes) {
        const r = (n.r + 3) * s;
        boxes.push({ x0: n.x - r, y0: n.y - r, x1: n.x + r, y1: n.y + r });
      }
      for (const gr of G.groups) {
        const w = textWidth(groupName(gr.id), 20) * s / 2;
        boxes.push({ x0: gr.labelPos.x - w, y0: gr.labelPos.y - 18 * s, x1: gr.labelPos.x + w, y1: gr.labelPos.y + 4 * s });
      }
      // 人名
      const order = G.nodes.slice().sort((a, b) => b.deg - a.deg);
      for (const n of order) {
        const w = n.labW, r = n.r;
        const cands = [[0, r + 14, 'middle'], [0, -r - 6, 'middle'], [r + 5, 4, 'start'], [-r - 5, 4, 'end'], [r + 2, r + 12, 'start'], [-r - 2, r + 12, 'end']];
        const opts = cands.map(([ox, oy, anchor]) => {
          const ax = n.x + ox * s, ay = n.y + oy * s;
          const x0 = anchor === 'start' ? ax : anchor === 'end' ? ax - w * s : ax - (w * s) / 2;
          return { ox, oy, anchor, box: { x0, y0: ay - 11 * s, x1: x0 + w * s, y1: ay + 3 * s } };
        });
        const pick = best(opts);
        n.lab.setAttribute('x', pick.ox);
        n.lab.setAttribute('y', pick.oy);
        n.lab.setAttribute('text-anchor', pick.anchor);
        boxes.push(pick.box);
      }
      // 关系说明：勾选了「常显」、放大到一定程度、被选中或鼠标停在上面时才显示
      const zoomedIn = graphZoom.z.k / graphZoom.z.k0 >= 2.2;
      const showAll = state.edgeLabels || zoomedIn;
      const visible = G.links.filter(l => l.lab && (showAll || l.hl || l.hov));
      visible.sort((a, b) => (b.hov - a.hov) || (b.hl - a.hl));
      for (const l of G.links) if (l.lab) l.lab.classList.toggle('show', false);
      for (const l of visible) {
        const g = l.geo;
        if (!g) continue;
        const w = l.labW * s, h = 15 * s;
        const opts = [];
        for (const t of [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74, 0.2, 0.8]) {
          const p = qpt(g, t);
          for (const dy of [0, -13, 13, -24, 24]) {
            const y = p.y + dy * s;
            opts.push({ x: p.x, y, box: { x0: p.x - w / 2, y0: y - h / 2, x1: p.x + w / 2, y1: y + h / 2 } });
          }
        }
        const pick = best(opts);
        l.lab.setAttribute('transform', `translate(${pick.x.toFixed(1)},${pick.y.toFixed(1)}) scale(${s})`);
        l.lab.classList.add('show');
        boxes.push(pick.box);
      }
    }

    function applyGraphHL(hl) {
      const sel = state.sel;
      const selKey = sel && ['char', 'fac', 'loc'].includes(sel.type) ? nodeKey({ kind: sel.type, id: sel.id }) : null;
      graphSvg.classList.toggle('has-hl', !!hl && hl.graphSet.size > 0);
      for (const n of G.nodes) {
        n.el.classList.toggle('sel', n.key === selKey);
        n.el.classList.toggle('hl', !!hl && hl.graphSet.has(n.key));
      }
      const incidentOnly = selKey && G.byKey.has(selKey) && (sel.type === 'char' || sel.type === 'fac');
      for (const l of G.links) {
        let on = false;
        if (hl) {
          on = incidentOnly
            ? (l.s === selKey && hl.graphSet.has(l.t)) || (l.t === selKey && hl.graphSet.has(l.s))
            : hl.graphSet.has(l.s) && hl.graphSet.has(l.t);
        }
        l.hl = on;
        [l.el, l.arrow, l.lab].forEach(e => { if (e) e.classList.toggle('hl', on); });
      }
      if (graphZoom) placeGraphLabels(labelScale(graphZoom.z, 0.3));
    }

    // 鼠标停在人物或连线上：亮出相关的关系说明
    function setGraphHover(nodeKeyOrNull, linkOrNull) {
      if (nodeKeyOrNull === hoverKey && linkOrNull === hoverLink) return;
      hoverKey = nodeKeyOrNull; hoverLink = linkOrNull;
      for (const l of G.links) {
        const on = l === linkOrNull || (!!nodeKeyOrNull && (l.s === nodeKeyOrNull || l.t === nodeKeyOrNull) && !l.member);
        l.hov = on;
        [l.el, l.arrow].forEach(e => { if (e) e.classList.toggle('hov', on); });
      }
      if (graphZoom) placeGraphLabels(labelScale(graphZoom.z, 0.3));
    }
    graphSvg.addEventListener('pointerover', e => {
      if (graphSvg.classList.contains('dragging')) return;
      const nodeEl = e.target.closest && e.target.closest('.node');
      if (nodeEl && G.byEl.has(nodeEl)) { setGraphHover(G.byEl.get(nodeEl).key, null); return; }
      if (e.target.__link) { setGraphHover(null, e.target.__link); return; }
      setGraphHover(null, null);
    });
    graphSvg.addEventListener('pointerleave', () => setGraphHover(null, null));

    // ================= 联动：选中的东西要高亮哪些 =================
    function highlightSets() {
      const s = state.sel;
      if (!s) return null;
      const mapSet = new Set(), graphSet = new Set();
      const addRelNeighbors = (kind, ids) => {
        for (const { a, b } of V.rels) {
          if (a.kind === kind && ids.includes(a.id)) graphSet.add(nodeKey(b));
          if (b.kind === kind && ids.includes(b.id)) graphSet.add(nodeKey(a));
        }
      };
      if (s.type === 'char') {
        graphSet.add('c:' + s.id);
        addRelNeighbors('char', [s.id]);
        for (const m of V.members) if (m.c === s.id) graphSet.add('f:' + m.f);
        for (const l of V.locsByChar.get(s.id) || []) mapSet.add(l);
      } else if (s.type === 'fac') {
        graphSet.add('f:' + s.id);
        addRelNeighbors('fac', [s.id]);
        for (const m of V.members) {
          if (m.f !== s.id) continue;
          graphSet.add('c:' + m.c);
          for (const l of V.locsByChar.get(m.c) || []) mapSet.add(l);
        }
      } else if (s.type === 'loc') {
        const l = locs.get(s.id);
        if (!l) return null;
        const ids = l.kind === 'nation' ? [s.id, ...[...V.locs].filter(id => locs.get(id).nation === s.id)] : [s.id];
        ids.forEach(id => { mapSet.add(id); graphSet.add('l:' + id); });
        const chars = l.kind === 'nation' ? nationChars(s.id) : (V.charsByLoc.get(s.id) || new Set());
        for (const c of chars) graphSet.add('c:' + c);
        addRelNeighbors('loc', ids);
      } else if (s.type === 'event') {
        const e = eventById.get(s.id);
        if (!e) return null;
        if (e.location) { mapSet.add(e.location); graphSet.add('l:' + e.location); }
        for (const c of e.characters || []) if (V.chars.has(c)) graphSet.add('c:' + c);
      } else if (s.type === 'act') {
        for (const e of V.events) {
          if (e.act !== s.id) continue;
          if (e.location) { mapSet.add(e.location); graphSet.add('l:' + e.location); }
          for (const c of e.characters || []) if (V.chars.has(c)) graphSet.add('c:' + c);
        }
      }
      return { mapSet, graphSet };
    }

    // ================= 侧栏：详情 =================
    function charChip(cid) {
      const c = charById.get(cid);
      if (!c || !V.chars.has(cid)) return '';
      return `<button class="chip" data-sel="char:${esc(cid)}"><i style="background:${charColor(c)}"></i>${esc(charName(c))}</button>`;
    }
    function facChip(fid) {
      const f = facById.get(fid);
      if (!f || !V.facs.has(fid)) return '';
      return `<button class="chip fac" data-sel="fac:${esc(fid)}"><i style="background:${facColor(f)}"></i>${esc(f.name)}</button>`;
    }
    function locChip(lid) {
      const l = locs.get(lid);
      if (!l || !V.locs.has(lid)) return '';
      const layer = l.layer !== 'surface' ? `<small class="muted">·${LAYER_NAME[l.layer] || l.layer}</small>` : '';
      return `<button class="chip loc" data-sel="loc:${esc(lid)}" data-focus="1"><i style="background:${locColor(l)}"></i>${esc(l.name)}${layer}</button>`;
    }
    const epChip = ep => (ep.kind === 'char' ? charChip(ep.id) : ep.kind === 'fac' ? facChip(ep.id) : locChip(ep.id));
    function chipsOf(list) {
      const h = list.filter(Boolean).join('');
      return h ? `<div class="chips">${h}</div>` : '<div class="empty-note">（暂无）</div>';
    }
    function eventCard(e) {
      const a = actById.get(e.act);
      const chars = (e.characters || []).map(charChip).join('');
      const where = e.location ? (locChip(e.location) || '') : '<span class="tag">无具体地点</span>';
      return `<div class="ev"><button class="ev-open" data-sel="event:${esc(e.id)}" data-focus="1">
          <div class="ev-act">${esc(a ? actFull(a) : e.act)}</div><div class="ev-sum">${esc(e.summary)}</div></button>
        <div class="chips">${where}${chars}</div></div>`;
    }
    function eventsBlock(list) {
      return list.length ? list.map(eventCard).join('') : '<div class="empty-note">（暂无已发生的事件）</div>';
    }
    function relList(kind, id) {
      const items = [];
      for (const { r, a, b } of V.rels) {
        let other, dir;
        if (a.kind === kind && a.id === id) { other = b; dir = '→'; }
        else if (b.kind === kind && b.id === id) { other = a; dir = '←'; }
        else continue;
        const cat = relCat(r.type);
        items.push(`<li><span class="rel-dot" style="background:${cat.color}" title="${esc(cat.name)}"></span><span class="dir">${dir}</span>
          <div>${epChip(other)} <span class="rl">${esc(r.label)}</span></div></li>`);
      }
      if (!items.length) return '<div class="empty-note">（暂无已揭晓的关系）</div>';
      return `<div class="small muted" style="margin-bottom:4px">→ 表示「这一方 对 对方」，← 表示「对方 对 这一方」</div><ul class="rel-list">${items.join('')}</ul>`;
    }

    function renderWelcome() {
      const placeCount = [...V.locs].filter(id => locs.get(id).kind !== 'nation').length;
      const a = actById.get(state.pid);
      return `<h3 style="margin:0">欢迎来到提瓦特</h3>
        <p class="muted">当前进度：<b style="color:var(--accent)">${esc(actFull(a))}</b>（${esc(a.version || '')}）。之后的剧情内容都已藏起来。</p>
        <div class="stats">
          <div class="stat"><b>${V.chars.size}</b><span>已登场人物</span></div>
          <div class="stat"><b>${placeCount}</b><span>已解锁地点</span></div>
          <div class="stat"><b>${V.events.length}</b><span>已发生事件</span></div>
        </div>
        <h4>可以这样玩</h4>
        <ul class="tips">
          <li>点<b>地图</b>上的地点，看那里发生过什么；关系图会同时亮起相关人物。</li>
          <li>点<b>关系图</b>里的人物，看 TA 的简介和关系；地图会亮起 TA 去过的地方。</li>
          <li>点上面的「剧情时间轴」，按顺序回顾每一幕，点事件会跳到对应地点。</li>
          <li>「神之心」页能看到七颗神之心现在在谁手里。</li>

    function renderCharDetail(c) {
      const nat = c.nation && nationById.get(c.nation);
      const facs = charFactions(c).filter(f => V.facs.has(f));
      const secrets = (c.secrets || []).filter(s => seen(s.reveal_at));

      const places = [...(V.locsByChar.get(c.id) || [])];
      const aliases = charAliases(c);
      const natTag = nat && V.locs.has(nat.id)
        ? `<button class="tag" data-sel="loc:${esc(nat.id)}" data-focus="1">${esc(nat.name)}</button>`
        : `<span class="tag">${nat ? esc(nat.name) : '不属于任何国家'}</span>`;
      return `<div class="d-head"><span class="d-dot" style="background:${charColor(c)}"></span><h3>${esc(charName(c))}</h3>${natTag}
          ${c.harbinger_rank != null ? `<span class="tag warn">愚人众执行官 · ${rankName(c.harbinger_rank)}</span>` : ''}</div>
        ${aliases.length ? `<p class="d-aliases">又名：${aliases.map(esc).join('、')}</p>` : ''}
        <p class="d-summary">${esc(charSummary(c))}</p>
        <p class="small muted">首次登场：${esc(actName(c.first_act))}</p>
        ${secrets.length ? `<h4>已揭晓的秘密</h4>${secrets.map(s => `<div class="secret">🔓 ${esc(s.text)}<small>揭晓于 ${esc(actName(s.reveal_at))}</small></div>`).join('')}` : ''}
        <h4>所属势力</h4>${chipsOf(facs.map(facChip))}
        <h4>人物关系</h4>${relList('char', c.id)}
        <h4>到过的地点 <span class="small muted">（地图上已高亮）</span></h4>${chipsOf(places.map(locChip))}
        <h4>相关事件（${evs.length}）</h4>${eventsBlock(evs)}`;

    function renderFacDetail(f) {
      const members = V.members.filter(m => m.f === f.id).map(m => charChip(m.c));
      const nat = f.nation && nationById.get(f.nation);
      return `<div class="d-head"><span class="d-dot" style="background:${facColor(f)};border-radius:3px"></span><h3>${esc(f.name)}</h3>
          <span class="tag">势力</span>${nat ? (V.locs.has(nat.id) ? locChip(nat.id) : `<span class="tag">${esc(nat.name)}</span>`) : ''}</div>
        <p class="d-summary">${esc(facDesc(f))}</p>
        <h4>成员（${members.length}）</h4>${chipsOf(members)}
        <h4>关系</h4>${relList('fac', f.id)}`;
    }

    function renderNationDetail(n) {
      const l = locs.get(n.id);
      const reached = nationReached(n.id);
      const ch = n.chapter && chapterById.get(n.chapter);
      const chFirst = n.chapter && chapterFirst.get(n.chapter);
      const arch = archonOf(n);
      const regions = (n.regions || []).filter(r => V.locs.has(r.id)).map(r => locChip(r.id));
      const evs = nationEvents(n.id);
      const parent = n.parent && nationById.get(n.parent);
      return `<div class="d-head"><span class="d-dot" style="background:${nationColor(n.id)}"></span><h3>${esc(n.name)}</h3>
          ${n.element ? `<span class="tag" style="color:${nationColor(n.id)}">${esc(n.element)}元素</span>` : ''}
          ${n.ideal ? `<span class="tag">理念：${esc(n.ideal)}</span>` : ''}
          ${parent ? `<span class="tag">属于${esc(parent.name)}</span>` : ''}</div>
        <p class="d-summary">神明：${arch.cid ? charChip(arch.cid) : `<span class="muted">${esc(arch.text)}</span>`}</p>
        <p class="small muted">${ch ? `对应章节：${esc(reached ? ch.title : chapterShort(n.chapter))}` : ''}
          ${!reached && chFirst ? `<br>按你目前的进度还没到这里，玩到「${esc(actShort(chFirst))}」后会显示这里的地点。` : ''}</p>
        <h4>地点</h4>${chipsOf(regions)}
        <h4>相关人物</h4>${chipsOf([...nationChars(n.id)].map(charChip))}
        ${V.rels.some(x => (x.a.kind === 'loc' && x.a.id === n.id) || (x.b.kind === 'loc' && x.b.id === n.id)) ? `<h4>关系</h4>${relList('loc', n.id)}` : ''}
        <h4>在这里发生的事件（${evs.length}）</h4>${eventsBlock(evs)}
        ${l && l.layer !== 'surface' ? '' : ''}`;

    function renderLocDetail(l) {
      if (l.kind === 'nation') return renderNationDetail(nationById.get(l.id));
      const evs = V.evByLoc.get(l.id) || [];
      const chars = [...(V.charsByLoc.get(l.id) || [])];
      const layerTag = `<span class="tag ${l.layer}">${LAYER_NAME[l.layer] || l.layer}</span>`;
      const natChip = l.nation ? locChip(l.nation) : '<span class="tag">特殊地点</span>';
      const hasRel = V.rels.some(x => (x.a.kind === 'loc' && x.a.id === l.id) || (x.b.kind === 'loc' && x.b.id === l.id));
      return `<div class="d-head"><span class="d-dot" style="background:${locColor(l)};border-radius:2px;transform:rotate(45deg)"></span><h3>${esc(l.name)}</h3>${layerTag}${natChip}</div>
        ${noteVisible(l) ? `<p class="d-summary">${esc(l.note)}</p>` : ''}
        ${!hasXY(l) ? '<p class="small muted">这个地点没有具体坐标，所以不在地图上显示。</p>' : ''}
        <h4>在这里发生的事件（${evs.length}）</h4>${eventsBlock(evs)}
        <h4>在这里出现过的人物</h4>${chipsOf(chars.map(charChip))}
        ${hasRel ? `<h4>关系</h4>${relList('loc', l.id)}` : ''}`;
    }

    function renderEventDetail(e) {
      const a = actById.get(e.act);
      const idx = V.events.findIndex(x => x.id === e.id);
      const prev = V.events[idx - 1], next = V.events[idx + 1];
      return `<div class="d-head"><span class="tag">剧情事件</span>${a ? `<span class="tag">${esc(a.version || '')}</span>` : ''}
          ${a && a.source === 'recap' ? '<span class="tag warn" title="这一幕的部分细节来自官方公告和玩家梳理，以游戏为准">含玩家梳理</span>' : ''}</div>
        <p class="ev-act" style="margin:10px 0 0">${esc(a ? actFull(a) : e.act)}</p>
        <p class="d-summary">${esc(e.summary)}</p>
        <h4>地点</h4>${e.location ? chipsOf([locChip(e.location)]) : '<div class="empty-note">这件事没有具体地点</div>'}
        <h4>出场人物</h4>${chipsOf((e.characters || []).map(charChip))}
        <div class="ev-nav">
          ${prev ? `<button class="btn" data-sel="event:${esc(prev.id)}" data-focus="1">◀ 上一个事件</button>` : '<span></span>'}
          ${next ? `<button class="btn" data-sel="event:${esc(next.id)}" data-focus="1">下一个事件 ▶</button>` : '<span></span>'}
        </div>
        <h4>这一幕的详细剧情</h4>${storyBlock(e.act)}`;
    }

    // 某一幕的详情：这一幕的事件 + 剧情梳理里的完整段落
    function renderActDetail(a) {
      const evs = V.events.filter(e => e.act === a.id);
      const seenActs = acts.filter(x => x.order <= state.P);
      const idx = seenActs.findIndex(x => x.id === a.id);
      const prev = seenActs[idx - 1], next = seenActs[idx + 1];
      return `<div class="d-head"><span class="tag">主线剧情</span><span class="tag">${esc(a.version || '')}</span>
          ${a.source === 'recap' ? '<span class="tag warn" title="这一幕的部分细节来自官方公告和玩家梳理，以游戏为准">含玩家梳理</span>' : ''}</div>
        <h3 style="margin:10px 0 0">${esc(actFull(a))}</h3>
        <h4>这一幕的事件（${evs.length}）</h4>${eventsBlock(evs)}
        <div class="ev-nav">
          ${prev ? `<button class="btn" data-sel="act:${esc(prev.id)}">◀ 上一幕</button>` : '<span></span>'}
          ${next ? `<button class="btn" data-sel="act:${esc(next.id)}">下一幕 ▶</button>` : '<span></span>'}
        </div>
        <h4>详细剧情</h4>${storyBlock(a.id)}`;
    }

    function renderDetail() {
      const box = $('#tab-detail');
      const s = state.sel;
      let html = '';
      if (!s) html = renderWelcome();
      else {
        let body = '';
        if (s.type === 'char') body = renderCharDetail(charById.get(s.id));
        else if (s.type === 'fac') body = renderFacDetail(facById.get(s.id));
        else if (s.type === 'loc') body = renderLocDetail(locs.get(s.id));
        else if (s.type === 'event') body = renderEventDetail(eventById.get(s.id));
        else if (s.type === 'act') body = renderActDetail(actById.get(s.id));
        html =`<div class="sel-bar"><span>当前选中</span><button class="btn" data-action="clear">清除选择（Esc）</button></div>${body}`;
      }
      box.innerHTML = html;
      box.scrollTop = 0;
    }

    // ================= 侧栏：剧情时间轴 =================
    function renderTimeline() {
      const box = $('#tab-timeline');
      const shown = acts.filter(a => a.order <= state.P);
      const groups = [];
      for (const a of shown) {
        const last = groups[groups.length - 1];
        if (last && last.chapter === a.chapter) last.acts.push(a);
        else groups.push({ chapter: a.chapter, acts: [a] });
      }
      let html = '<p class="small muted" style="margin-top:0">只列出你已经玩过的部分。点事件，地图会飞到事件发生的地点。</p>';
      for (const g of groups) {
        const ch = chapterById.get(g.chapter);
        html += `<div class="tl-chapter"><h4>${esc(ch ? ch.title : chapterShort(g.chapter))}</h4>`;
        for (const a of g.acts) {
          const evs = V.events.filter(e => e.act === a.id);
          html += `<div class="tl-act${a.id === state.pid ? ' current' : ''}" id="tl-${esc(a.id)}">
            <div class="tl-act-head">${esc(actFull(a))}<span class="ver">${esc(a.version || '')}</span>
            ${a.source === 'recap' ? ' <span class="tag warn" title="这一幕的部分细节来自官方公告和玩家梳理，以游戏为准">含玩家梳理</span>' : ''}
            ${a.id === state.pid ? ' <span class="tag" style="color:var(--accent)">你在这里</span>' : ''}
            <button class="tl-more" data-sel="act:${esc(a.id)}">📖 详细剧情</button></div>`;
          if (!evs.length) html += '<div class="small muted">（这一幕没有单独记录的事件）</div>';
          for (const e of evs) {
            const l = e.location && locs.get(e.location);
            const who = (e.characters || []).filter(c => V.chars.has(c)).map(c => charName(charById.get(c))).join('、');
            html += `<button class="tl-ev" data-sel="event:${esc(e.id)}" data-focus="1" data-keep-tab="1">${esc(e.summary)}

          }
          html += '</div>';
        }
        html += '</div>';
      }
      const locked = acts.length - shown.length;
      if (locked > 0) html += `<div class="tl-locked">🔒 后面还有 ${locked} 幕没解锁<br><span class="small">在顶部「我玩到了」调整进度后才会显示</span></div>`;
      else html += '<div class="tl-locked">🎉 已经是数据里的最新一幕了</div>';
      box.innerHTML = html;
    }
    function scrollTimelineToCurrent() {
      const box = $('#tab-timeline'), el = document.getElementById('tl-' + state.pid);
      if (el && !box.hidden) box.scrollTop += el.getBoundingClientRect().top - box.getBoundingClientRect().top - box.clientHeight / 3;
    }

    // ================= 侧栏：神之心 =================
    function renderGnosis() {
      const box = $('#tab-gnosis');
      let fatuiCount = 0;
      const gems = [], cards = [];
      for (const g of gnoses) {
        const color = ELEMENT_COLOR[g.element] || NEUTRAL;
        const nation = nations.find(n => n.element === g.element);
        const steps = (g.path || []).filter(p => seen(p.act));
        const orig = charById.get(g.original_holder);
        const origHtml = orig && V.chars.has(orig.id) && allSecretsSeen(orig)
          ? charChip(orig.id) : `<span class="muted">${esc(g.element)}神（身份尚未揭晓）</span>`;
        const last = steps[steps.length - 1];
        let nowHtml, inFatui = false, lost = false;
        if (!last || last.holder === g.original_holder) nowHtml = '<b>仍在原主人手里</b>';
        else if (last.holder == null) { nowHtml = '<b>下落不明</b>'; lost = true; }
        else {
          const h = charById.get(last.holder);
          nowHtml = h && V.chars.has(h.id) ? charChip(h.id) : '<span class="muted">（未知）</span>';
          inFatui = !!h && charFactions(h).includes('fatui');
        }
        if (inFatui) fatuiCount++;
        const allShown = steps.length === (g.path || []).length;
        let belong = '';
        if (allShown && steps.length && g.current_holder && facById.has(g.current_holder) && V.facs.has(g.current_holder)) belong = `<div class="small muted">目前归属：${facChip(g.current_holder)}</div>`;
        gems.push(`<span title="${esc(g.element)}之神之心"><i class="gn-mini${inFatui ? ' taken' : lost ? ' lost' : ''}" style="--gc:${color}"></i>${esc(g.element)}</span>`);
        cards.push(`<div class="gn-card" style="--gc:${color}">
          <div class="gn-title"><span class="gn-gem"></span>${esc(g.element)}之神之心 ${nation ? `<span class="tag">${esc(nation.name)}</span>` : ''}</div>
          <div class="gn-now">现在：${nowHtml}${inFatui ? ' <span class="tag warn">在愚人众手中</span>' : ''}</div>
          ${belong}
          <ol class="gn-path"><li>原主人：${origHtml}</li>
          ${steps.map(p => `<li>${p.holder ? (charChip(p.holder) || '<span class="muted">（未知）</span>') : '<b>下落不明</b>'}<small>${esc(actName(p.act))}${p.note ? ' · ' + esc(p.note) : ''}</small></li>`).join('')}
          </ol></div>`);
      }
      box.innerHTML = `<div class="gn-summary">按你目前的进度，愚人众手里已经有 <b>${fatuiCount}</b> 颗神之心。
          <div class="gn-row">${gems.join('')}</div>
          <div class="small muted" style="margin-top:6px">实心 = 在愚人众手中，空心 = 不在，虚线 = 下落不明。点名字可以看人物详情。</div></div>
        ${cards.join('')}`;
    }

    // ================= 顶栏：进度、筛选、搜索 =================
    const progSel = $('#progressSelect');
    function renderProgressSelect() {
      let html = '', cur = null;
      for (const a of acts) {
        if (a.chapter !== cur) {
          if (cur !== null) html += '</optgroup>';
          const ch = chapterById.get(a.chapter);
          const label = a.order <= state.P && ch ? ch.title : chapterShort(a.chapter);
          html += `<optgroup label="${esc(label)}">`;
          cur = a.chapter;
        }
        const label = a.order <= state.P ? `${actFull(a)} · ${a.version || ''}` : `${actShort(a)} · ${a.version || ''}（未解锁）`;
        html += `<option value="${esc(a.id)}"${a.id === state.pid ? ' selected' : ''}>${esc(label)}</option>`;
      }
      progSel.innerHTML = html + '</optgroup>';
      progSel.value = state.pid;
    }
    progSel.addEventListener('change', () => setProgress(progSel.value));

    function renderDataInfo() {
      const meta = D.meta || {};
      const a = actById.get(state.pid);
      $('#dataInfo').textContent = `数据日期 ${meta.as_of || '未知'} · 已解锁 ${a.order} / ${acts.length} 幕${PUBLISHED ? '' : ' · 完全离线'}`;
    }

    const nationFilter = $('#nationFilter'), factionFilter = $('#factionFilter');
    function renderFilters() {
      nationFilter.innerHTML = '<option value="">全部国家</option>' + nations.filter(n => V.locs.has(n.id))
        .map(n => `<option value="${esc(n.id)}">${esc(n.name)}</option>`).join('');
      nationFilter.value = state.fNation;
      factionFilter.innerHTML = '<option value="">全部势力</option>' + factions.filter(f => V.facs.has(f.id))
        .map(f => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');
      factionFilter.value = state.fFaction;
    }
    nationFilter.addEventListener('change', () => { state.fNation = nationFilter.value; renderGraph(true); refreshSelection(); });
    factionFilter.addEventListener('change', () => { state.fFaction = factionFilter.value; renderGraph(true); refreshSelection(); });
    const neighborToggle = $('#neighborToggle'), edgeLabelToggle = $('#edgeLabelToggle');
    neighborToggle.checked = state.neighbors;
    edgeLabelToggle.checked = state.edgeLabels;
    neighborToggle.addEventListener('change', () => { state.neighbors = neighborToggle.checked; saveUI(); renderGraph(true); refreshSelection(); });
    edgeLabelToggle.addEventListener('change', () => { state.edgeLabels = edgeLabelToggle.checked; saveUI(); updateGraphGeometry(); });
    const isolatedToggle = $('#isolatedToggle');
    isolatedToggle.checked = state.hideIsolated;
    isolatedToggle.addEventListener('change', () => { state.hideIsolated = isolatedToggle.checked; saveUI(); renderGraph(true); refreshSelection(); });

    // 搜索
    const searchInput = $('#searchInput'), searchResults = $('#searchResults');
    function searchItems() {
      const items = [];
      for (const cid of V.chars) { const c = charById.get(cid); items.push({ key: 'char:' + cid, name: charName(c), alt: charAliases(c).join(' '), kind: '人物', color: charColor(c) }); }
      for (const lid of V.locs) { const l = locs.get(lid); items.push({ key: 'loc:' + lid, name: l.name, alt: '', kind: l.kind === 'nation' ? '国家' : '地点', color: locColor(l) }); }
      for (const fid of V.facs) { const f = facById.get(fid); items.push({ key: 'fac:' + fid, name: f.name, alt: '', kind: '势力', color: facColor(f) }); }
      return items;
    }
    function closeSearch() { searchResults.hidden = true; }
    function runSearch() {
      const q = searchInput.value.trim();
      if (!q) { closeSearch(); return; }
      const hits = searchItems().filter(it => it.name.includes(q) || it.alt.includes(q)).slice(0, 14);
      searchResults.innerHTML = hits.length
        ? hits.map((h, i) => `<button class="${i === 0 ? 'active' : ''}" data-sel="${esc(h.key)}" data-focus="1"><i class="d-dot" style="width:10px;height:10px;background:${h.color}"></i>${esc(h.name)}<span class="kind">${h.kind}</span></button>`).join('')
        : '<div class="empty">没有找到（还没登场的人物不会出现在这里）</div>';
      searchResults.hidden = false;
    }
    searchInput.addEventListener('input', runSearch);
    searchInput.addEventListener('focus', runSearch);
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { const first = $('button', searchResults); if (first && !searchResults.hidden) first.click(); }
      if (e.key === 'Escape') { searchInput.value = ''; closeSearch(); searchInput.blur(); e.stopPropagation(); }
    });
    document.addEventListener('pointerdown', e => { if (!e.target.closest('.search-box')) closeSearch(); });

    // ================= 选中 / 跳转 =================
    function selectionVisible(s) {
      if (s.type === 'char') return V.chars.has(s.id);
      if (s.type === 'fac') return V.facs.has(s.id);
      if (s.type === 'loc') return V.locs.has(s.id);
      if (s.type === 'event') return V.events.some(e => e.id === s.id);
      if (s.type === 'act') return actById.has(s.id) && actById.get(s.id).order <= state.P;
      return false;
    }
    function select(key, opts = {}) {
      if (!key) state.sel = null;
      else { const i = key.indexOf(':'); state.sel = { type: key.slice(0, i), id: key.slice(i + 1) }; }
      if (state.sel && !selectionVisible(state.sel)) state.sel = null;
      if (!opts.keepTab) setTab('detail');
      if (state.sel) openSheet();
      refreshSelection();
      if (opts.focus && state.sel) focusSelection();
    }
    function refreshSelection() {
      const hl = highlightSets();
      applyMapHL(hl);
      applyGraphHL(hl);
      renderDetail();
      const k = state.sel ? `${state.sel.type}:${state.sel.id}` : '';
      $$('.tl-ev').forEach(b => b.classList.toggle('sel', b.dataset.sel === k));
    }
    function focusSelection() {
      const s = state.sel;
      let lid = null;
      if (s.type === 'loc') lid = s.id;
      else if (s.type === 'event') lid = (eventById.get(s.id) || {}).location || null;
      if (lid && state.layout !== 'graph') {
        const l = locs.get(lid);
        if (l && V.locs.has(lid)) {
          if (l.kind !== 'nation' && hasXY(l) && !state.layers[l.layer]) {
            state.layers[l.layer] = true;
            saveUI(); syncLayerButtons(); renderMap(); applyMapHL(highlightSets());
          }
          if (l.kind === 'nation') { const p = nationLabelPos.get(lid); if (p) mapZoom.focus(p.x, p.y, 1.7); }
          else if (dpos.has(lid)) { const p = dpos.get(lid); mapZoom.focus(p.x, p.y, 2.4); }
        }
      }
      if ((s.type === 'char' || s.type === 'fac') && state.layout !== 'map') {
        const key = nodeKey({ kind: s.type, id: s.id });
        if (!G.byKey.has(key) && (state.fNation || state.fFaction)) {
          state.fNation = ''; state.fFaction = '';
          renderFilters(); renderGraph(true); applyGraphHL(highlightSets());
        }
        const n = G.byKey.get(key);
        if (n) graphZoom.focus(n.x, n.y, 1.3);
      }
    }

    document.addEventListener('click', e => {
      const act = e.target.closest('[data-action]');
      if (act) {
        if (act.dataset.action === 'clear') select(null);
        return;
      }
      const t = e.target.closest('[data-sel]');
      if (!t || t.closest('svg')) return;
      e.preventDefault();
      if (t.closest('.search-results')) { closeSearch(); searchInput.value = ''; }
      select(t.dataset.sel, { focus: t.dataset.focus === '1', keepTab: t.dataset.keepTab === '1' });
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (!$('#helpModal').hidden) { $('#helpModal').hidden = true; return; }
      if (state.sel) select(null, { keepTab: true });
    });

    // ================= 版面、图层、标签页 =================
    // 手机上：侧栏变成从底部拉起的面板（收起 / 半屏 / 全屏），点选东西时自动拉到半屏
    const mobileMQ = window.matchMedia('(max-width: 820px)');
    const sidePanel = $('.side');
    const setSheet = mode => { sidePanel.dataset.sheet = mode; };
    function openSheet() { if (mobileMQ.matches && sidePanel.dataset.sheet === 'peek') setSheet('half'); }
    $('#sheetHandle').addEventListener('click', () => setSheet({ peek: 'half', half: 'full', full: 'peek' }[sidePanel.dataset.sheet] || 'half'));
    setSheet('peek');

    function setTab(name) {
      state.tab = name;
      $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
      for (const t of ['detail', 'timeline', 'gnosis']) $('#tab-' + t).hidden = t !== name;
      if (name === 'timeline') scrollTimelineToCurrent();
    }
    $$('#tabs button').forEach(b => b.addEventListener('click', () => { setTab(b.dataset.tab); openSheet(); }));

    function setLayout(name) {
      state.layout = name;
      saveUI();
      const main = $('#main');
      main.classList.remove('layout-both', 'layout-map', 'layout-graph');
      main.classList.add('layout-' + name);
      $$('#layoutSeg button').forEach(b => b.classList.toggle('on', b.dataset.layout === name));
    }
    $$('#layoutSeg button').forEach(b => b.addEventListener('click', () => setLayout(b.dataset.layout)));

    function syncLayerButtons() {
      $$('#layerToggles button').forEach(b => b.classList.toggle('on', !!state.layers[b.dataset.layer]));
    }
    $$('#layerToggles button').forEach(b => b.addEventListener('click', () => {
      state.layers[b.dataset.layer] = !state.layers[b.dataset.layer];
      saveUI(); syncLayerButtons(); renderMap(); applyMapHL(highlightSets());
    }));

    $$('.zoom-btns').forEach(box => {
      box.addEventListener('click', e => {
        const b = e.target.closest('[data-zoom]');
        if (!b) return;
        const z = box.dataset.for === 'map' ? mapZoom : graphZoom;
        if (b.dataset.zoom === 'in') z.zoomCenter(1.4);
        else if (b.dataset.zoom === 'out') z.zoomCenter(1 / 1.4);
        else z.fit(true);
      });
    });

    // ================= 使用说明 =================
    function renderHelp() {
      const meta = D.meta || {};
      const dflt = actById.get(defaultPid);
      // 发布到网上的版本（手机、朋友看的）不需要「改数据」这些只对本机文件有用的说明
      const localOnly = PUBLISHED ? '' : `
        <h3>改了数据之后</h3>
        <ol>
          <li>用记事本打开 <code>data/genshin_world_data.json</code>（或剧情梳理的 .md 文件），修改并保存。</li>
          <li>双击文件夹里的 <b>更新数据.bat</b>，看到「成功」后按任意键关闭黑色窗口。</li>
          <li>回到网页按 <b>F5</b> 刷新。</li>
        </ol>
        <p>小提示：网页会优先使用你上次在页面上选的进度。如果你改了 json 里的 meta.player_progress，想让它生效，点下面这个按钮：</p>
        <p><button class="btn" id="resetProgress">恢复为数据文件里的默认进度（${esc(dflt ? actShort(dflt) : defaultPid)}）</button></p>`;
      $('#helpBody').innerHTML = `
        <p>${PUBLISHED ? '这是网页版的提瓦特世界观地图，手机和电脑都能看。' : '这是一个完全离线的网页：不联网、不需要安装软件。双击「原神世界观地图.html」就能打开。'}</p>
        <h3>怎么用</h3>
        <ul>
          <li><b>选进度</b>：在顶部「我玩到了」选你目前打到的那一幕。之后的人物、事件、关系、秘密都会自动藏起来。选好会自动记住，下次打开不用重选。</li>
          <li><b>地图</b>：滚轮缩放，按住鼠标拖动，双击放大。点地点能看到在那里发生过的事件，关系图会同时亮起相关人物。点大字的国家名可以看整个国家。</li>
          <li><b>天空和地下</b>：天空的地点是悬浮的星形（下面有影子），地下的地点是紫色虚线圈。地图上方的「地表 / 天空 / 地下」按钮可以单独打开或关掉某一层；只开「地下」时，地表会变暗。</li>
          <li><b>人物关系</b>：圆点是人物（颜色 = 所属国家的元素色，金色是旅行者），六边形是势力，菱形是地点；红色虚线圈表示愚人众执行官。连线颜色表示关系类型，箭头从主动的一方指向另一方，虚线表示「属于这个势力」。人物按国家分成一块块，每块垫着该国的元素色；不属于任何国家的人（比如旅行者）在正中间。关系说明平时不显示，鼠标移到人物或连线上、点选人物、或者放大后才出现；想一直显示可以勾「常显全部关系说明」。可以按国家、势力筛选，勾「隐藏没关系的人」能去掉没有任何人物关系的人，也可以拖动人物调整位置。点人物后，地图上会亮起 TA 去过的地点。</li>
          <li><b>剧情时间轴</b>：按顺序列出你已经玩过的各幕和事件，点事件，地图会飞到对应地点。每一幕后面的「📖 详细剧情」按钮，以及每个事件的详情页，都会显示剧情梳理里这一幕的完整内容。如果梳理把这一幕和后面一幕写在同一段，要等后面那一幕也玩到才显示。</li>
          <li><b>神之心</b>：七颗神之心现在在谁手里，以及一路是怎么流转的。</li>
          <li>右上角可以切换「并排 / 只看地图 / 只看关系图」。按 <b>Esc</b> 取消选中。</li>
          <li><b>手机上</b>：用两根手指缩放地图和关系图，一根手指拖动。点地点或人物后，详情会从屏幕下方弹出；点面板顶部的「点这里展开 / 收起」可以调整高度。</li>
        </ul>
        <h3>防剧透是怎么做的</h3>
        <ul>
          <li>所有带 reveal_at 或 act 的内容，只显示在你进度之内（含当前这一幕）的部分。</li>
          <li>人物的 first_act 在你进度之后，整个人物都不显示（地图、关系图、搜索里都找不到）。</li>
          <li>人物的别名（比如某位神明的真名）要等 TA 的秘密全部揭晓后才显示。</li>
          <li>地点说明如果提到还没登场的人物，或者那里的事件还没发生，会先藏起来；还没到达的国家，里面的具体地点也先不显示。</li>
          <li>少数名字和说明本身就带剧透，页面会先用当时剧情里的叫法代替。</li>
          <li>进度下拉框里，还没玩到的幕只显示编号和版本，不显示标题。</li>
        </ul>
        ${localOnly}
        <h3>关于数据</h3>
        <ul>
          <li>数据日期：${esc(meta.as_of || '未知')}。地图坐标是示意坐标，只表示大致方位。</li>
          <li>标着「含玩家梳理」的幕，部分细节来自官方公告和玩家梳理，以游戏为准。</li>
        </ul>
        <h3>数据检查</h3>
        ${warnings.length
          ? `<div class="warn-box"><p style="margin:0 0 4px">发现 ${warnings.length} 处问题（不影响其他内容显示）：</p><ul>${warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`
          : '<p class="muted">没有发现问题。</p>'}`;
      if ($('#resetProgress')) $('#resetProgress').addEventListener('click', () => {
        store.del(STORAGE_KEY);
        setProgress(defaultPid);
        $('#helpModal').hidden = true;
      });
    }
    $('#helpBtn').addEventListener('click', () => { renderHelp(); $('#helpModal').hidden = false; });
    $('#helpModal').addEventListener('click', e => { if (e.target.id === 'helpModal' || e.target.closest('[data-close]')) $('#helpModal').hidden = true; });

    // ================= 总刷新 =================
    function setProgress(pid) {
      if (!actById.has(pid)) return;
      state.pid = pid;
      state.P = actById.get(pid).order;
      store.set(STORAGE_KEY, pid);
      refreshAll(true);
    }
    function refreshAll(progressChanged) {
      V = computeVisible();
      spoilerTokens = computeSpoilerTokens();
      if (state.sel && !selectionVisible(state.sel)) state.sel = null;
      if (state.fFaction && !V.facs.has(state.fFaction)) state.fFaction = '';
      if (state.fNation && !V.locs.has(state.fNation)) state.fNation = '';
      renderProgressSelect();
      renderDataInfo();
      renderFilters();
      renderMap();
      renderGraph(true);
      renderTimeline();
      renderGnosis();
      refreshSelection();
      if (progressChanged && state.tab === 'timeline') scrollTimelineToCurrent();
    }

    // ================= 开始 =================
    let mapZoom = null, graphZoom = null;
    $('#graphLegend').innerHTML = '<span class="hint">鼠标移到人物或连线上显示关系说明，放大后全部显示</span>' + REL_CATS.map(c => `<span><i class="ln" style="border-color:${c.color}"></i>${c.name}</span>`).join('')
      + '<span><i class="ln dash" style="border-color:#7a86a6"></i>所属势力</span>'
      + '<span><i class="shape c"></i>人物</span><span><i class="shape f"></i>势力</span><span><i class="shape l"></i>地点</span>'
      + '<span><i class="shape c" style="background:none;border:1px dashed #ef6b6b"></i>愚人众执行官</span>';
    setLayout(state.layout);
    syncLayerButtons();
    try { buildBaseMap(); } catch (err) { console.warn('底图绘制失败，只显示地点', err); }

    mapZoom = makeZoom(mapSvg, mapVP, {
      bounds: () => ({ x: -30, y: -10, w: MW + 100, h: MH + 20 }), // 右边多留一点，给稻妻的地名

      onScale: applyMapScale,
      onTap: target => { const el = target.closest && target.closest('[data-sel]'); if (el) select(el.getAttribute('data-sel')); },
    });
    graphZoom = makeZoom(graphSvg, graphVP, {
      bounds: graphBounds,
      onScale: updateGraphGeometry,
      // 窗口形状变化很大时（比如切换版面、调整浏览器大小），重新铺开关系图
      onResize: ({ w, h }) => {
        if (!V || w < 50 || h < 50 || Math.abs(h / w - layoutAspect) < 0.15 * Math.max(layoutAspect, 0.1)) return false;
        renderGraph(true); applyGraphHL(highlightSets());
        return true;
      },
      grab: target => {
        const el = target.closest && target.closest('.node');
        const n = el && G.byEl.get(el);
        if (!n) return null;
        return { move(dx, dy) { n.x += dx; n.y += dy; updateGraphGeometry(); } };
      },
      onTap: target => { const el = target.closest && target.closest('[data-sel]'); if (el) select(el.getAttribute('data-sel')); },
    });
    refreshAll(false);
    mapZoom.fit(false);
    graphZoom.fit(false);
    if (firstVisit) showFirstVisit();

    function showFirstVisit() {
      const box = document.createElement('div');
      box.className = 'modal';
      box.id = 'firstVisit';
      let options = '', cur = null;
      for (const a of acts) {
        if (a.chapter !== cur) {
          if (cur !== null) options += '</optgroup>';
          const ch = chapterById.get(a.chapter);
          options += `<optgroup label="${esc(ch ? ch.title : chapterShort(a.chapter))}">`;
          cur = a.chapter;
        }
        options += `<option value="${esc(a.id)}"${a.id === defaultPid ? ' selected' : ''}>${esc(actFull(a))} · ${esc(a.version || '')}</option>`;
      }
      options += '</optgroup>';
      box.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="firstVisitTitle">
          <h2 id="firstVisitTitle">你玩到哪一幕了？</h2>
          <p>这张地图会按你的进度把后面的剧情藏起来，防止剧透。请选你目前打到的那一幕：这一幕和之前的内容会显示，之后的都不显示。</p>
          <p><select id="firstVisitSelect" class="wide-select">${options}</select></p>
          <p class="small muted">以后可以在页面顶部「我玩到了」随时修改。选好后会记在这台设备上，下次打开不用再选。</p>
          <p><button class="btn primary" id="firstVisitGo">开始看地图</button></p>
        </div>`;
      document.body.appendChild(box);
      $('#firstVisitGo').addEventListener('click', () => {
        const pid = $('#firstVisitSelect').value;
        box.remove();
        setProgress(pid);
      });
    }
  }
})();

</script>
</body>
</html>
